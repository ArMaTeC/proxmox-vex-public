name: secrets-scan

# Roadmap ID-0691: gitleaks in CI, not only pre-commit — a hook is
# bypassable (--no-verify) and only covers the committer's machine.
# Pinned release binary, checksum-verified; .gitleaksignore holds the
# baselined pre-existing findings (ID-0199 audit) so only NEW leaks fail.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned, checksum-verified)
        run: |
          V=8.28.0
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          grep ' linux_x64\.tar\.gz$' "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --verbose --redact
