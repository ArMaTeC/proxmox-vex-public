name: Publish Docker Image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "version.json"
      - "dist/ProxmoxVEx-*.tar.gz"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4

      - name: Read release version
        id: ver
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building GHCR image for version $VER"

      - name: Extract verified release tarball
        run: |
          mkdir -p /tmp/vex-build
          tar -xzf "dist/ProxmoxVEx-${{ steps.ver.outputs.version }}.tar.gz" -C /tmp/vex-build
          if [ -f "/tmp/vex-build/ProxmoxVEx-${{ steps.ver.outputs.version }}/Dockerfile" ]; then
            CTX="/tmp/vex-build/ProxmoxVEx-${{ steps.ver.outputs.version }}"
          else
            CTX="/tmp/vex-build"
          fi
          # Ensure optional Dockerfile COPY directories/scripts exist (paid plugins
          # are already stripped from the public release tarball).
          mkdir -p "$CTX/qemu_iso" "$CTX/fixtures" "$CTX/scripts" "$CTX/static" "$CTX/images" "$CTX/plugins"
          [ -f "$CTX/scripts/filter_free_plugins_for_image.py" ] || printf '#!/usr/bin/env python3\npass\n' > "$CTX/scripts/filter_free_plugins_for_image.py"
          echo "BUILD_CTX=$CTX" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-tag image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CTX }}
          file: ${{ env.BUILD_CTX }}/Dockerfile
          push: true
          tags: |
            ghcr.io/armatec/proxmox-vex-public:${{ steps.ver.outputs.version }}
            ghcr.io/armatec/proxmox-vex-public:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ArMaTeC/proxmox-vex-public
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
