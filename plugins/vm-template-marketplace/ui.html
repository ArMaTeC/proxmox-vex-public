<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Template Marketplace</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>VM Template Marketplace</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="catalog">Catalog</button>
            <button class="tab" role="tab" data-tab="add">Add / Edit</button>
            <button class="tab" role="tab" data-tab="jobs">Import Jobs</button>
        </div>

        <div id="panel-catalog" class="tab-panel">
            <div class="card">
                <h2>Catalog</h2>
                <div class="actions" style="margin-bottom:12px;">
                    <input type="text" id="cSearch" placeholder="Search name / ID" />
                    <select id="cCategory">
                        <option value="">All categories</option>
                        <option value="linux">Linux</option>
                        <option value="windows">Windows</option>
                    </select>
                    <input type="text" id="cTag" placeholder="Filter by tag" />
                    <button id="exportJson" class="secondary">Export JSON</button>
                </div>
                <div id="catalogList">
                    <p class="empty">No templates.</p>
                </div>
            </div>
        </div>

        <div id="panel-add" class="tab-panel" hidden>
            <div class="card">
                <h2>Add / Edit Template</h2>
                <form class="form" id="tmplForm">
                    <label>ID <input type="text" id="tId" required placeholder="ubuntu-2204" /></label>
                    <label>Name <input type="text" id="tName" required placeholder="Ubuntu 22.04" /></label>
                    <label>Source URL <input type="text" id="tSource"
                            placeholder="http://.../ubuntu-22.04.qcow2" /></label>
                    <label>Category <input type="text" id="tCategory" placeholder="linux" /></label>
                    <label>Tags (comma separated) <input type="text" id="tTags"
                            placeholder="linux,ubuntu,server" /></label>
                    <label>Description <textarea id="tDesc" rows="2" placeholder="Description"></textarea></label>
                    <button type="submit">Save</button>
                    <button type="button" id="tReset" class="secondary">Reset</button>
                </form>
                <p id="tError" class="error-text"></p>
            </div>
        </div>

        <div id="panel-jobs" class="tab-panel" hidden>
            <div class="card">
                <h2>Import Jobs</h2>
                <div id="jobsList">
                    <p class="empty">No jobs.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
