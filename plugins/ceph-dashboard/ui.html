<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceph Dashboard</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Ceph Dashboard</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="status">Status</button>
            <button class="tab" role="tab" data-tab="pools">Pools</button>
            <button class="tab" role="tab" data-tab="osds">OSDs</button>
            <button class="tab" role="tab" data-tab="history">History</button>
        </div>

        <div id="panel-status" class="tab-panel">
            <div class="card">
                <h2>Cluster Status</h2>
                <div class="form">
                    <label>Cluster <select id="cCluster" required>
                            <option value="">Select</option>
                        </select></label>
                    <button id="cLoad">Load</button>
                    <label>Refresh <input type="number" id="cRefresh" value="0" min="0" max="300"
                            title="Seconds, 0 to disable" style="width:80px" /></label>
                </div>
                <p id="cError" class="error-text"></p>
                <div id="cResult" class="grid" hidden>
                    <div class="metric">
                        <div class="value" id="cHealth">-</div>
                        <div class="label">Health</div>
                    </div>
                    <div class="metric">
                        <div class="value" id="cMonitors">-</div>
                        <div class="label">Monitors</div>
                    </div>
                    <div class="metric">
                        <div class="value" id="cOsds">-</div>
                        <div class="label">OSDs up/in</div>
                    </div>
                    <div class="metric">
                        <div class="value" id="cNode">-</div>
                        <div class="label">Queried node</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="panel-pools" class="tab-panel" hidden>
            <div class="card">
                <h2>Pools</h2>
                <input type="text" id="pSearch" placeholder="Filter by name" />
                <div id="poolsList">
                    <p class="empty">No pools.</p>
                </div>
            </div>
        </div>

        <div id="panel-osds" class="tab-panel" hidden>
            <div class="card">
                <h2>OSDs</h2>
                <div id="osdsList">
                    <p class="empty">No OSDs.</p>
                </div>
            </div>
        </div>

        <div id="panel-history" class="tab-panel" hidden>
            <div class="card">
                <h2>Health History</h2>
                <div id="historyList">
                    <p class="empty">No history.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
