<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Billing Portal</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Client Billing Portal</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="card">
            <h2>Load Client</h2>
            <div class="form">
                <input type="hidden" id="clientName" />
                <label>Client <select id="client" required>
                        <option value="">Select</option>
                    </select></label>
                <button id="loadClient">Load</button>
            </div>
            <p id="clientError" class="error-text"></p>
            <div id="summary" class="grid" hidden>
                <div class="metric">
                    <div class="value" id="sName">-</div>
                    <div class="label">Client</div>
                </div>
                <div class="metric">
                    <div class="value" id="sTotal">-</div>
                    <div class="label">Usage Total</div>
                </div>
            </div>
        </div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="invoices">Invoices</button>
            <button class="tab" role="tab" data-tab="usage">Usage</button>
            <button class="tab" role="tab" data-tab="payments">Payments</button>
        </div>

        <div id="panel-invoices" class="tab-panel">
            <div class="card">
                <h2>Generate Invoice</h2>
                <form class="form" id="invForm">
                    <input type="hidden" id="iClient" />
                    <label>Total <input type="number" id="iTotal" min="0" step="0.01" required /></label>
                    <label>Items (JSON) <textarea id="iItems" rows="2"
                            placeholder='[{"desc":"VM hours","qty":10,"rate":0.5}]'></textarea></label>
                    <button type="submit">Generate</button>
                </form>
                <p id="iError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Invoices</h2>
                <div class="form">
                    <label>Status <select id="iFilter">
                            <option value="">All</option>
                            <option value="pending">Pending</option>
                            <option value="paid">Paid</option>
                            <option value="void">Void</option>
                        </select></label>
                </div>
                <div id="invoicesList">
                    <p class="empty">No invoices.</p>
                </div>
            </div>
        </div>

        <div id="panel-usage" class="tab-panel" hidden>
            <div class="card">
                <h2>Usage</h2>
                <div class="form">
                    <label>Resource <input type="text" id="uRes" placeholder="Filter" /></label>
                </div>
                <div id="usageList">
                    <p class="empty">No usage.</p>
                </div>
            </div>
        </div>

        <div id="panel-payments" class="tab-panel" hidden>
            <div class="card">
                <h2>Record Payment</h2>
                <div class="form">
                    <input type="hidden" id="pClient" />
                    <label>Invoice <input type="text" id="pInvoice" placeholder="invoice-id" /></label>
                    <label>Amount <input type="number" id="pAmount" min="0.01" step="0.01" /></label>
                    <button id="pRecord">Record</button>
                </div>
                <p id="pError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Payments</h2>
                <div id="paymentsList">
                    <p class="empty">No payments.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
