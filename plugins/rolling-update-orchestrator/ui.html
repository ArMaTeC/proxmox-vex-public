<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Update Orchestrator</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Rolling Update Orchestrator</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="plans">Plans</button>
            <button class="tab" role="tab" data-tab="create">Create</button>
        </div>

        <div id="panel-plans" class="tab-panel">
            <div class="grid">
                <div class="stat">
                    <div class="muted">Orchestrator</div>
                    <div class="num" id="sOrc">idle</div>
                </div>
                <div class="stat">
                    <div class="muted">Total Plans</div>
                    <div class="num" id="sCount">0</div>
                </div>
            </div>
            <div class="card">
                <h2>Plans</h2>
                <div class="form">
                    <label>Status <select id="pStatus">
                            <option value="">All</option>
                            <option value="created">Created</option>
                            <option value="running">Running</option>
                            <option value="aborted">Aborted</option>
                            <option value="failed">Failed</option>
                        </select></label>
                    <label>Search <input type="text" id="pSearch" placeholder="plan or cluster" /></label>
                    <button id="pLoad" class="secondary">Refresh</button>
                </div>
                <div id="pList">
                    <p class="empty">No plans.</p>
                </div>
            </div>
        </div>

        <div id="panel-create" class="tab-panel" hidden>
            <div class="card">
                <h2>Create Plan</h2>
                <div class="form">
                    <label>Cluster <select id="cCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>Template <select id="cTemplate">
                            <option value="">Default</option>
                            <option value="safe">Safe (cordon, evacuate, update, reboot)</option>
                            <option value="fast">Fast (update, reboot)</option>
                        </select></label>
                    <label>Steps <input type="text" id="cSteps" value="cordon, evacuate, update, reboot" /></label>
                </div>
                <div class="form">
                    <button id="cLoadVms" class="secondary" type="button">Load VMs</button>
                    <button id="cCreate">Create</button>
                </div>
                <div class="form" id="cVmBox" hidden>
                    <label style="width: 100%;">VM sequence (select and order the guests to process)
                        <div class="seq">
                            <div>
                                <div class="muted" style="margin-bottom:4px;">Available</div>
                                <select id="cAvail" multiple></select>
                            </div>
                            <div class="seq-btns" style="padding-top: 24px;">
                                <button id="cAdd" type="button">&gt;</button>
                                <button id="cRemove" type="button">&lt;</button>
                            </div>
                            <div>
                                <div class="muted" style="margin-bottom:4px;">Selected order</div>
                                <select id="cSel" multiple></select>
                                <div class="seq-btns h" style="margin-top: 6px;">
                                    <button id="cUp" type="button" class="secondary">Up</button>
                                    <button id="cDown" type="button" class="secondary">Down</button>
                                </div>
                            </div>
                        </div>
                    </label>
                </div>
                <p id="cError" class="error-text"></p>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
