<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetApp Storage</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>NetApp Storage</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="message"></div>

        <div class="tabs">
            <div class="tab active" data-tab="dashboard" data-i18n="dashboard">Dashboard</div>
            <div class="tab" data-tab="snapshots" data-i18n="snapshots">Snapshots</div>
            <div class="tab" data-tab="schedules" data-i18n="schedules">Schedules</div>
            <div class="tab" data-tab="volumes" data-i18n="volumes">Volumes</div>
            <div class="tab" data-tab="snapmirrors" data-i18n="snapmirrors">SnapMirror</div>
            <div class="tab" data-tab="dr" data-i18n="dr">DR</div>
        </div>

        <div class="panel active" id="dashboardPanel">
            <div class="grid" id="dashboardStats"></div>
            <div class="card">
                <h2 data-i18n="capacity">Capacity</h2>
                <div id="capacityResult" class="empty"></div>
            </div>
        </div>

        <div class="panel" id="snapshotsPanel">
            <div class="card">
                <h2 data-i18n="snapshots">Snapshots</h2>
                <div class="toolbar">
                    <input type="text" id="snapSearch" placeholder="Search..." />
                    <select id="snapVolume"></select>
                    <button id="snapRefresh" data-i18n="refresh">Refresh</button>
                    <button class="secondary" id="snapExportCsv" data-i18n="exportCSV">CSV</button>
                </div>
                <div id="snapshotsList">
                    <p class="empty">No snapshots.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="schedulesPanel">
            <div class="card">
                <h2 data-i18n="schedules">Schedules</h2>
                <form class="form" id="scheduleForm">
                    <label>Name <input type="text" name="name" required /></label>
                    <label>Volume <input type="text" name="volume" required /></label>
                    <label>Frequency <input type="text" name="frequency" placeholder="1h" required /></label>
                    <label>Retention <input type="number" name="retention" value="24" /></label>
                    <button type="submit" data-i18n="add">Add</button>
                </form>
                <div id="schedulesList">
                    <p class="empty">No schedules.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="volumesPanel">
            <div class="card">
                <h2 data-i18n="volumes">Volumes</h2>
                <div class="toolbar">
                    <select id="volProtected">
                        <option value="">All</option>
                        <option value="true">Protected</option>
                        <option value="false">Unprotected</option>
                    </select>
                    <button id="volRefresh">Refresh</button>
                </div>
                <div id="volumesList">
                    <p class="empty">No volumes.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="snapmirrorsPanel">
            <div class="card">
                <h2 data-i18n="snapmirrors">SnapMirror</h2>
                <form class="form" id="smForm">
                    <label>Source <input type="text" name="source" required /></label>
                    <label>Destination <input type="text" name="destination" required /></label>
                    <button type="submit" data-i18n="create">Create</button>
                </form>
                <div id="snapmirrorsList">
                    <p class="empty">No SnapMirror.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="drPanel">
            <div class="card">
                <h2 data-i18n="dr">Disaster Recovery</h2>
                <div id="drList">
                    <p class="empty">No plans.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
