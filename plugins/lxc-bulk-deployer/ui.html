<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXC Bulk Deployer</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>LXC Bulk Deployer</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="deploy">Deploy</button>
            <button class="tab" role="tab" data-tab="jobs">Jobs</button>
            <button class="tab" role="tab" data-tab="specs">Specs</button>
        </div>

        <div id="panel-deploy" class="tab-panel">
            <div class="card">
                <h2>Queue Deployment</h2>
                <div class="form">
                    <label>Saved spec <select id="dSpec">
                            <option value="">Manual</option>
                        </select></label>
                    <label>Cluster <select id="dCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>Source VMID/template <input type="text" id="dSource" placeholder="100" /></label>
                    <label>Count <input type="number" id="dCount" min="1" max="100" value="1" /></label>
                    <label>Prefix <input type="text" id="dPrefix" value="lxc-" /></label>
                    <label>Start index <input type="number" id="dStart" value="1" /></label>
                    <button id="dQueue">Queue</button>
                </div>
                <p id="dError" class="error-text"></p>
                <div id="dResult">
                    <p class="empty">No deployment queued.</p>
                </div>
            </div>
        </div>

        <div id="panel-jobs" class="tab-panel" hidden>
            <div class="card">
                <h2>Jobs</h2>
                <div class="form">
                    <label>Filter status <select id="jStatus">
                            <option value="">All</option>
                            <option value="queued">Queued</option>
                            <option value="running">Running</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="completed">Completed</option>
                        </select></label>
                    <label>Sort <select id="jSort">
                            <option value="created">Created</option>
                            <option value="status">Status</option>
                        </select></label>
                    <button id="jLoad">Refresh</button>
                </div>
                <p id="jError" class="error-text"></p>
                <div id="jobsList">
                    <p class="empty">No jobs.</p>
                </div>
            </div>
        </div>

        <div id="panel-specs" class="tab-panel" hidden>
            <div class="card">
                <h2>Saved Specs</h2>
                <div class="form">
                    <label>Name <input type="text" id="sName" placeholder="Web Farm" /></label>
                    <label>Source <input type="text" id="sSource" placeholder="100" /></label>
                    <label>Count <input type="number" id="sCount" min="1" max="100" value="1" /></label>
                    <label>Prefix <input type="text" id="sPrefix" value="lxc-" /></label>
                    <label>Start index <input type="number" id="sStart" value="1" /></label>
                    <label>Memory MB <input type="number" id="sMem" value="512" /></label>
                    <label>Cores <input type="number" id="sCores" value="1" /></label>
                    <button id="sSave">Save Spec</button>
                </div>
                <p id="sError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Specs List</h2>
                <div id="specsList">
                    <p class="empty">No specs.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
