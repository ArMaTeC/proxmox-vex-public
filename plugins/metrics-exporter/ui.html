<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Metrics Exporter</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Prometheus Metrics Exporter</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="metrics">Metrics Preview</button>
            <button class="tab" role="tab" data-tab="targets">Scrape Targets</button>
            <button class="tab" role="tab" data-tab="config">Configuration</button>
        </div>

        <div id="panel-metrics" class="tab-panel">
            <div class="card">
                <h2>Preview Metrics</h2>
                <div class="form">
                    <label>Cluster <select id="mCluster">
                            <option value="">Global</option>
                        </select></label>
                    <label>Filter prefix <input type="text" id="mPrefix" placeholder="pve_" /></label>
                    <button id="mPreview">Preview</button>
                    <button id="mCopy" class="secondary">Copy</button>
                    <button id="mDownload" class="secondary">Download</button>
                </div>
                <p id="mError" class="error-text"></p>
                <pre id="mOutput" class="muted">No metrics previewed.</pre>
            </div>
        </div>

        <div id="panel-targets" class="tab-panel" hidden>
            <div class="card">
                <h2>Add Target</h2>
                <div class="form">
                    <label>Target ID <input type="text" id="tId" placeholder="target-001" /></label>
                    <label>Cluster <select id="tCluster">
                            <option value="">Any</option>
                        </select></label>
                    <label>Enabled <select id="tEnabled">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select></label>
                    <button id="tAdd">Add</button>
                </div>
                <p id="tError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Targets</h2>
                <div class="form">
                    <label>Filter enabled <select id="tFilterEnabled">
                            <option value="">All</option>
                            <option value="true">Enabled</option>
                            <option value="false">Disabled</option>
                        </select></label>
                    <label>Filter cluster <select id="tFilterCluster">
                            <option value="">All</option>
                        </select></label>
                    <label>Sort <select id="tSort">
                            <option value="target_id">ID</option>
                            <option value="added_at">Added</option>
                        </select></label>
                    <button id="tLoad" class="secondary">Refresh</button>
                </div>
                <div id="targetsList">
                    <p class="empty">No targets.</p>
                </div>
            </div>
        </div>

        <div id="panel-config" class="tab-panel" hidden>
            <div class="card">
                <h2>Exporter Configuration</h2>
                <div class="form">
                    <label>Interval (s) <input type="number" id="cInterval" value="60" min="5" /></label>
                    <label>Format <select id="cFormat">
                            <option value="prometheus">Prometheus</option>
                            <option value="influx">Influx</option>
                            <option value="json">JSON</option>
                        </select></label>
                    <label>Path <input type="text" id="cPath" value="/metrics" /></label>
                    <button id="cSave">Save</button>
                </div>
                <p id="cError" class="error-text"></p>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
