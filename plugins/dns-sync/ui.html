<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Sync</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>DNS Sync</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="zones">Zones</button>
            <button class="tab" role="tab" data-tab="sync">Sync</button>
            <button class="tab" role="tab" data-tab="records">Records</button>
            <button class="tab" role="tab" data-tab="export">Export</button>
        </div>

        <div id="panel-zones" class="tab-panel">
            <div class="card">
                <h2 id="zoneFormTitle">Add Zone</h2>
                <input type="hidden" id="zEditId" />
                <div class="form">
                    <label>Name <input type="text" id="zName" placeholder="example.com" /></label>
                    <label>Type <select id="zType">
                            <option value="forward">Forward</option>
                            <option value="reverse">Reverse</option>
                        </select></label>
                    <label id="zPtrTargetLabel" hidden>PTR target domain <input type="text" id="zPtrTarget"
                            placeholder="example.com" /></label>
                    <button id="zSave">Add</button>
                    <button id="zCancel" class="secondary" hidden>Cancel</button>
                </div>
                <p id="zError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Zones</h2>
                <div class="form">
                    <label>Type <select id="zFilter">
                            <option value="">All</option>
                            <option value="forward">Forward</option>
                            <option value="reverse">Reverse</option>
                        </select></label>
                    <button id="zLoad">Refresh</button>
                </div>
                <p id="zListError" class="error-text"></p>
                <div id="zonesList">
                    <p class="empty">No zones.</p>
                </div>
            </div>
        </div>

        <div id="panel-sync" class="tab-panel" hidden>
            <div class="card">
                <h2>Cluster Sync</h2>
                <div class="form">
                    <label>Cluster <select id="sCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>Target Zone <select id="sZone">
                            <option value="">Select</option>
                        </select></label>
                    <button id="sRun">Dry-Run Sync</button>
                    <button id="sApply" class="secondary" disabled>Apply</button>
                </div>
                <p id="sError" class="error-text"></p>
                <div id="syncResult">
                    <p class="empty">No sync run.</p>
                </div>
            </div>
        </div>

        <div id="panel-records" class="tab-panel" hidden>
            <div class="card">
                <h2>Records</h2>
                <div id="recordsList">
                    <p class="empty">No records.</p>
                </div>
            </div>
        </div>

        <div id="panel-export" class="tab-panel" hidden>
            <div class="card">
                <h2>Export Zone</h2>
                <div class="form">
                    <label>Zone <select id="eZone">
                            <option value="">Select</option>
                        </select></label>
                    <label>Format <select id="eFormat">
                            <option value="bind">BIND zone file</option>
                            <option value="dnsmasq">dnsmasq</option>
                        </select></label>
                    <button id="eRun">Generate</button>
                    <button id="eDownload" class="secondary" disabled>Download</button>
                    <button id="eCopy" class="secondary" disabled>Copy</button>
                </div>
                <p id="eError" class="error-text"></p>
                <pre id="eOutput" class="export-output" hidden></pre>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
