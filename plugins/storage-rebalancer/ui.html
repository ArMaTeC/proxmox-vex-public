<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Rebalancer</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 data-i18n="title">Storage Rebalancer</h1>
            <div class="toolbar">
                <span class="status" id="statusText" data-i18n="loading">Loading…</span>
            </div>
        </header>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="grid">
            <div class="card">
                <div class="title" data-i18n="status">Status</div>
                <div class="value" id="statusValue">-</div>
            </div>
            <div class="card">
                <div class="title" data-i18n="vmCount">VM count</div>
                <div class="value" id="vmCount">-</div>
            </div>
            <div class="card">
                <div class="title" data-i18n="cluster">Cluster</div>
                <div class="value" style="font-size:1rem;" id="selectedClusterName">-</div>
            </div>
        </div>

        <div class="tabs" role="tablist" id="tabs">
            <button class="tab active" data-tab="analyze" role="tab" data-i18n="analyze">Analyze</button>
            <button class="tab" data-tab="plan" role="tab" data-i18n="plan">Plan</button>
            <button class="tab" data-tab="bulk" role="tab" data-i18n="bulkRebalance">Bulk</button>
            <button class="tab" data-tab="history" role="tab" data-i18n="history">History</button>
            <button class="tab" data-tab="trends" role="tab" data-i18n="trends">Trends</button>
            <button class="tab" data-tab="settings" role="tab" data-i18n="settings">Settings</button>
        </div>

        <!-- Analyze -->
        <div id="tab-analyze" class="tab-content active" role="tabpanel">
            <div class="section">
                <h2 data-i18n="analyze">Analyze</h2>
                <form class="form" id="analyzeForm">
                    <label data-i18n="cluster">Cluster
                        <select id="analyzeCluster" name="cluster_id" required style="width:220px;">
                            <option value="" data-i18n="selectCluster">Select a cluster</option>
                        </select>
                    </label>
                    <label><input type="checkbox" id="analyzeRefresh" name="refresh" value="1" /> <span
                            data-i18n="refresh">Record snapshot</span></label>
                    <label data-i18n="autoRefresh">Auto-refresh
                        <select id="autoRefresh" style="width:120px;">
                            <option value="0" selected>Off</option>
                            <option value="30">30s</option>
                            <option value="60">60s</option>
                            <option value="300">5m</option>
                        </select>
                    </label>
                    <button type="submit" id="analyzeBtn" data-i18n="analyze">Analyze</button>
                    <button type="button" id="exportAnalyzeBtn" class="secondary" data-i18n="exportJson">Export
                        JSON</button>
                </form>
                <div class="form">
                    <label data-i18n="filterByName">Filter by name…
                        <input id="vmFilter" type="text" placeholder="name or vmid" />
                    </label>
                    <label data-i18n="thresholdWarning">Warning threshold (%)
                        <input id="warnThreshold" type="number" min="0" max="100" value="70" style="width:80px;" />
                    </label>
                    <label data-i18n="thresholdDanger">Danger threshold (%)
                        <input id="dangerThreshold" type="number" min="0" max="100" value="90" style="width:80px;" />
                    </label>
                </div>
                <div id="analyzeResult">
                    <p class="empty" data-i18n="emptyStateAnalyze">Select a cluster and click Analyze to begin.</p>
                </div>
            </div>
        </div>

        <!-- Plan / Execute -->
        <div id="tab-plan" class="tab-content" role="tabpanel">
            <div class="section">
                <h2 data-i18n="plan">Plan</h2>
                <form class="form" id="planForm">
                    <label data-i18n="cluster">Cluster
                        <select id="planCluster" name="cluster_id" required style="width:220px;"></select>
                    </label>
                    <label data-i18n="vmid">VMID
                        <select id="planVm" name="vmid" required style="width:120px;"></select>
                    </label>
                    <button type="submit" id="planBtn" data-i18n="plan">Plan</button>
                    <button type="button" id="dryRunPlanBtn" class="secondary" data-i18n="dryRun">Dry Run</button>
                </form>
                <div id="planResult"></div>
            </div>

            <div class="section">
                <h2 data-i18n="execute">Execute</h2>
                <form class="form" id="executeForm">
                    <label data-i18n="cluster">Cluster
                        <select id="executeCluster" name="cluster_id" required style="width:220px;"></select>
                    </label>
                    <label data-i18n="vmid">VMID
                        <select id="executeVm" name="vmid" required style="width:120px;"></select>
                    </label>
                    <label data-i18n="targetStorage">Target Storage
                        <select id="executeTarget" name="target_storage" required style="width:180px;"></select>
                    </label>
                    <label><input type="checkbox" id="executeDryRun" name="dry_run" /> <span data-i18n="dryRun">Dry
                            run</span></label>
                    <button type="submit" id="executeBtn" data-i18n="execute">Execute</button>
                </form>
                <div id="executeResult"></div>
            </div>
        </div>

        <!-- Bulk -->
        <div id="tab-bulk" class="tab-content" role="tabpanel">
            <div class="section">
                <h2 data-i18n="bulkRebalance">Bulk Rebalance</h2>
                <p class="muted" data-i18n="select">Select one or more VMs in the Analyze tab first.</p>
                <div class="form">
                    <button id="bulkPlanBtn" data-i18n="bulkPlan">Bulk Plan</button>
                    <button id="bulkDryRunBtn" class="secondary" data-i18n="dryRun">Run Dry Run</button>
                    <button id="bulkExecuteBtn" class="secondary" data-i18n="bulkExecute">Bulk Execute</button>
                </div>
                <div id="bulkSummary"></div>
                <div id="bulkResult"></div>
            </div>
        </div>

        <!-- History -->
        <div id="tab-history" class="tab-content" role="tabpanel">
            <div class="section">
                <h2 data-i18n="history">History</h2>
                <div class="form">
                    <input id="historyFilterStatus" type="text" placeholder="status" style="width:120px;" />
                    <input id="historyFilterVmid" type="number" placeholder="VMID" style="width:100px;" />
                    <button id="loadHistoryBtn" data-i18n="refresh">Refresh</button>
                    <button id="exportHistoryCsv" class="secondary" data-i18n="exportCsv">Export CSV</button>
                    <button id="exportHistoryJson" class="secondary" data-i18n="exportJson">Export JSON</button>
                </div>
                <div id="historyList">
                    <p class="empty" data-i18n="noHistory">No history records.</p>
                </div>
            </div>
        </div>

        <!-- Trends -->
        <div id="tab-trends" class="tab-content" role="tabpanel">
            <div class="section">
                <h2 data-i18n="trends">Trends</h2>
                <form class="form" id="trendsForm">
                    <label data-i18n="cluster">Cluster
                        <select id="trendsCluster" name="cluster_id" style="width:220px;"></select>
                    </label>
                    <label data-i18n="name">Storage
                        <select id="trendsStorage" name="storage" style="width:180px;">
                            <option value="">All</option>
                        </select>
                    </label>
                    <label data-i18n="interval">Interval
                        <select id="trendsInterval" name="interval" style="width:120px;">
                            <option value="daily" data-i18n="daily">Daily</option>
                            <option value="hourly" data-i18n="hourly">Hourly</option>
                        </select>
                    </label>
                    <button type="submit" data-i18n="refresh">Refresh</button>
                </form>
                <div id="trendsResult">
                    <p class="empty" data-i18n="noSnapshots">No trend data available.</p>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div id="tab-settings" class="tab-content" role="tabpanel">
            <div class="section">
                <h2 data-i18n="settings">Settings</h2>
                <form class="form" id="settingsForm">
                    <label data-i18n="thresholdWarning">Warning threshold (%)
                        <input id="settingWarning" type="number" min="0" max="100" value="70" required />
                    </label>
                    <label data-i18n="thresholdDanger">Danger threshold (%)
                        <input id="settingDanger" type="number" min="0" max="100" value="90" required />
                    </label>
                    <button type="submit" data-i18n="save">Save</button>
                </form>
            </div>
        </div>
    </div>

    <div class="dialog-overlay" id="confirmDialog">
        <div class="dialog" role="dialog" aria-modal="true">
            <h3 id="confirmTitle" data-i18n="confirmExecute">Confirm</h3>
            <p id="confirmBody"></p>
            <div class="actions">
                <button id="confirmCancel" class="secondary" data-i18n="cancel">Cancel</button>
                <button id="confirmOk" data-i18n="execute">OK</button>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
