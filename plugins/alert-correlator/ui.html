<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Correlator</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Alert Correlator</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="grid" id="metrics"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="incidents">Incidents</button>
            <button class="tab" role="tab" data-tab="correlate">Correlate</button>
            <button class="tab" role="tab" data-tab="rules">Rules</button>
        </div>

        <div id="panel-incidents" class="tab-panel">
            <div class="card">
                <h2>Incidents</h2>
                <div class="actions" style="margin-bottom:12px;">
                    <input type="text" id="iSearch" placeholder="Search" />
                    <select id="iStatus">
                        <option value="">All statuses</option>
                        <option value="open">Open</option>
                        <option value="acknowledged">Acknowledged</option>
                        <option value="resolved">Resolved</option>
                    </select>
                    <select id="iCluster">
                        <option value="">All clusters</option>
                    </select>
                </div>
                <div id="incidentsList">
                    <p class="empty">No incidents.</p>
                </div>
            </div>
        </div>

        <div id="panel-correlate" class="tab-panel" hidden>
            <div class="card">
                <h2>Correlate Alerts</h2>
                <form class="form" id="correlateForm">
                    <label>Cluster <select id="cCluster">
                            <option value="">Unclustered</option>
                        </select></label>
                    <label>Title <input type="text" id="cTitle" /></label>
                    <label style="flex:1 1 100%;">Alerts (JSON) <textarea id="cAlerts" rows="6"
                            placeholder='[{"node":"pve-1","alert":"disk warn"}, {"vmid":100,"alert":"node down"}]'></textarea></label>
                    <button type="submit">Correlate</button>
                </form>
                <p id="cError" class="error-text"></p>
            </div>
        </div>

        <div id="panel-rules" class="tab-panel" hidden>
            <div class="card">
                <h2>Add / Edit Rule</h2>
                <form class="form" id="ruleForm">
                    <input type="hidden" id="rOld" />
                    <label>Rule ID <input type="text" id="rId" required placeholder="vmid" /></label>
                    <label>Description <input type="text" id="rDesc" /></label>
                    <label>Key <input type="text" id="rKey" placeholder="vmid" /></label>
                    <button type="submit">Save</button>
                    <button type="button" id="rReset" class="secondary">Reset</button>
                </form>
                <p id="rError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Rules</h2>
                <div id="rulesList">
                    <p class="empty">No rules.</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="noteDialog"
        style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;max-width:500px;width:90%;">
        <h2>Add Note</h2>
        <textarea id="noteText" rows="3" style="width:100%;margin-bottom:12px;"></textarea>
        <div class="actions"><button id="noteAck" type="button">Acknowledge</button><button id="noteResolve"
                type="button">Resolve</button><button id="noteClose" type="button" class="secondary">Close</button>
        </div>
    </dialog>


    <script src="ui.js"></script>
</body>

</html>
