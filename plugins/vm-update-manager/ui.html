<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VM Update Manager</title>
  <link rel="stylesheet" href="/api/plugins/vm-update-manager/api/ui.css?v=__CACHE_BUST__">
  <script src="/static/js/purify.min.js"></script>
  <script src="/api/plugins/vm-update-manager/api/ui.js?v=__CACHE_BUST__" defer></script>
</head>

<body>
  <div id="app">
    <h1 data-i18n="title">VM Update Manager</h1>

    <!-- Guest list toolbar + table: kept full-width above the two-column
         section below since the table has many columns (name, vmid, ip, os,
         user, enabled, scheduled, last check, status, next run, actions) and
         needs the full viewport width to stay readable rather than being
         squeezed into a half-width column. -->
    <div class="toolbar">
      <button id="newGuest" class="btn" data-i18n="addGuest">Add Guest</button>
      <button id="refresh" class="btn secondary" data-i18n="refresh">Refresh</button>
      <input id="searchGuests" type="search" data-i18n-placeholder="searchGuests" placeholder="Search..."
        class="search-input" style="width:auto;min-width:180px;" aria-label="Search guests">
      <select id="filterStatus" class="search-input" aria-label="Filter by status">
        <option value="" data-i18n="filterAllStatus">All statuses</option>
        <option value="ok" data-i18n="filterOk">OK</option>
        <option value="error" data-i18n="filterError">Error</option>
        <option value="running" data-i18n="filterRunning">Running</option>
        <option value="never" data-i18n="filterNever">Never checked</option>
      </select>
      <select id="filterOsFamily" class="search-input" aria-label="Filter by OS family">
        <option value="" data-i18n="filterAllOs">All OS families</option>
        <option value="debian">Debian</option>
        <option value="ubuntu">Ubuntu</option>
        <option value="alpine">Alpine</option>
        <option value="centos">CentOS</option>
        <option value="windows">Windows</option>
        <option value="unknown" data-i18n="unknown">Unknown</option>
      </select>
      <button id="checkSelected" class="btn secondary" data-i18n="checkSelected" disabled>Check selected</button>
      <button id="applySelected" class="btn secondary" data-i18n="applySelected" disabled>Apply selected</button>
      <button id="exportGuestsCsv" class="btn small secondary" data-i18n="exportCsv">Export CSV</button>
      <span id="statusMsg" class="status" role="status" aria-live="polite" aria-atomic="true"></span>
      <span id="guestCount" class="table-count"></span>
    </div>

    <div class="table-scroll table-scroll-x">
      <table class="guest-table">
        <thead>
          <tr>
            <th scope="col"><input type="checkbox" id="selectAllGuests" aria-label="Select all guests"></th>
            <th scope="col" data-sort="name" tabindex="0" role="button" aria-sort="ascending" data-i18n="name">Name</th>
            <th scope="col" data-sort="vmid" tabindex="0" role="button" data-i18n="vmid">VM ID</th>
            <th scope="col" data-sort="ip_host" tabindex="0" role="button" data-i18n="ipHost">IP / Host</th>
            <th scope="col" data-sort="os_family" tabindex="0" role="button" data-i18n="osFamily">OS</th>
            <th scope="col" data-sort="username" tabindex="0" role="button" data-i18n="username">User</th>
            <th scope="col" data-sort="enabled" tabindex="0" role="button" data-i18n="enabled">Enabled</th>
            <th scope="col" data-sort="schedule_enabled" tabindex="0" role="button" data-i18n="scheduled">Scheduled</th>
            <th scope="col" data-sort="last_check_at" tabindex="0" role="button" data-i18n="lastCheck">Last Check</th>
            <th scope="col" data-sort="last_status" tabindex="0" role="button" data-i18n="lastStatus">Status</th>
            <th scope="col" data-sort="next_run" tabindex="0" role="button" data-i18n="nextRun">Next Run</th>
            <th scope="col" data-i18n="actions">Actions</th>
          </tr>
        </thead>
        <tbody id="guestsBody"></tbody>
      </table>
    </div>

    <div class="grid">
      <div class="col col-a">
        <form id="form" class="card">
          <h2 id="formTitle" data-i18n="addGuest">Add Guest</h2>
          <input type="hidden" id="guestId">
          <input type="hidden" id="guestType" value="vm">

          <div class="form-group">
            <label for="cluster" data-i18n="cluster">Cluster</label>
            <select id="cluster" name="cluster" required>
              <option value="" data-i18n="selectCluster">Select cluster</option>
            </select>
          </div>

          <div class="form-group">
            <label for="vmid" data-i18n="vmid">VM / Container</label>
            <select id="vmid" name="vmid" required disabled>
              <option value="" data-i18n="selectVm">Select VM / container</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="name" data-i18n="name">Name</label>
              <input id="name" name="name" type="text" required>
            </div>
            <div class="form-group">
              <label for="ipHost" data-i18n="ipHost">IP / Host</label>
              <input id="ipHost" name="ipHost" type="text" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="sshPort" data-i18n="sshPort">Port</label>
              <input id="sshPort" name="sshPort" type="number" min="1" max="65535" value="22" required>
            </div>
            <div class="form-group">
              <label for="osFamily" data-i18n="osFamily">OS Family</label>
              <select id="osFamily" name="osFamily">
                <option value="unknown">Unknown</option>
                <option value="debian">Debian</option>
                <option value="ubuntu">Ubuntu</option>
                <option value="alpine">Alpine</option>
                <option value="centos">CentOS</option>
                <option value="windows">Windows</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="username" data-i18n="username">Username</label>
              <input id="username" name="username" type="text" required>
            </div>
            <div class="form-group">
              <label for="authType" data-i18n="authType">Authentication</label>
              <select id="authType" name="authType">
                <option value="password" data-i18n="authPassword">Password</option>
                <option value="ssh_key" data-i18n="authSshKey">SSH key</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group" id="passwordGroup">
              <label for="password" data-i18n="password">Password</label>
              <input id="password" name="password" type="password" required>
            </div>
            <div class="form-group hidden" id="sshKeyGroup">
              <label for="sshPrivateKey" data-i18n="sshPrivateKey">SSH private key</label>
              <textarea id="sshPrivateKey" name="sshPrivateKey" rows="4"
                placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
            </div>
          </div>

          <h2 data-i18n="schedule">Schedule</h2>

          <div class="checkbox-group">
            <label for="enabled">
              <input id="enabled" name="enabled" type="checkbox" checked>
              <span data-i18n="status">Enabled</span>
            </label>
            <label for="scheduleEnabled">
              <input id="scheduleEnabled" name="scheduleEnabled" type="checkbox">
              <span data-i18n="scheduleEnabled">Schedule enabled</span>
            </label>
            <label for="autoApply">
              <input id="autoApply" name="autoApply" type="checkbox">
              <span data-i18n="autoApply">Auto-apply</span>
            </label>
            <label for="dryRun">
              <input id="dryRun" name="dryRun" type="checkbox" checked>
              <span data-i18n="dryRun">Dry run</span>
            </label>
            <label for="notifyOnFailure">
              <input id="notifyOnFailure" name="notifyOnFailure" type="checkbox" checked>
              <span data-i18n="notifyOnFailure">Notify on failure</span>
            </label>
          </div>

          <div class="form-group">
            <label for="scheduleCron" data-i18n="scheduleCron">Cron expression</label>
            <input id="scheduleCron" name="scheduleCron" type="text" value="0 2 * * *" placeholder="0 2 * * *">
          </div>

          <div class="actions">
            <button type="submit" class="btn" data-i18n="save">Save</button>
            <button type="button" id="cancel" class="btn secondary" data-i18n="cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div class="col col-b">
        <div id="packagesPanel" class="panel hidden">
          <div class="panel-header">
            <h2 id="packagesTitle" data-i18n="packages">Packages</h2>
            <div class="panel-header-actions">
              <button id="packagesPreview" class="btn small secondary" data-i18n="preview">Preview</button>
              <button id="packagesApply" class="btn small" data-i18n="apply">Apply</button>
            </div>
          </div>
          <div class="table-scroll">
            <table class="guest-table">
              <thead>
                <tr>
                  <th scope="col" data-i18n="name">Package</th>
                  <th scope="col" data-i18n="currentVersion">Current</th>
                  <th scope="col" data-i18n="availableVersion">Available</th>
                  <th scope="col" data-i18n="security">Security</th>
                </tr>
              </thead>
              <tbody id="packagesBody"></tbody>
            </table>
          </div>
        </div>

        <div id="jobsPanel" class="panel">
          <div class="panel-header">
            <h2 data-i18n="jobLog">Job log</h2>
            <button id="exportJobsCsv" class="btn small secondary" data-i18n="exportCsv">Export CSV</button>
          </div>
          <div class="table-scroll">
            <table class="guest-table">
              <thead>
                <tr>
                  <th data-i18n="name">Guest</th>
                  <th data-i18n="jobType">Type</th>
                  <th data-i18n="status">Status</th>
                  <th data-i18n="packagesFound">Found</th>
                  <th data-i18n="packagesApplied">Applied</th>
                  <th data-i18n="when">When</th>
                  <th data-i18n="duration">Duration</th>
                </tr>
              </thead>
              <tbody id="jobsBody"></tbody>
            </table>
          </div>
        </div>

        <div id="consolePanel" class="panel">
          <div class="panel-header">
            <h2 data-i18n="console">Console</h2>
            <div class="panel-header-actions">
              <button id="jumpToBottom" class="btn small secondary hidden" data-i18n="jumpToBottom">Jump to
                bottom</button>
              <button id="copyConsole" class="btn small secondary" data-i18n="copy">Copy</button>
              <button id="downloadConsole" class="btn small secondary" data-i18n="download">Download</button>
              <button id="clearConsole" class="btn small secondary" data-i18n="consoleClear">Clear</button>
            </div>
          </div>
          <div id="consoleBody" class="console-body" aria-live="polite" aria-atomic="false" data-i18n="noOutput">No output yet.</div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
