<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Cluster Replication</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Cross-Cluster Replication</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="jobs">Jobs</button>
            <button class="tab" role="tab" data-tab="create">Create</button>
            <button class="tab" role="tab" data-tab="drift">Drift</button>
        </div>

        <div id="panel-jobs" class="tab-panel">
            <div class="card">
                <h2>Jobs</h2>
                <div class="form">
                    <label>Source <select id="jSource">
                            <option value="">All</option>
                        </select></label>
                    <label>Target <select id="jTarget">
                            <option value="">All</option>
                        </select></label>
                    <label>Status <select id="jStatus">
                            <option value="">All</option>
                            <option value="enabled">Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select></label>
                    <button id="jFilter">Filter</button>
                    <button id="jReset" class="secondary">Reset</button>
                </div>
                <p id="jError" class="error-text"></p>
                <div id="jobsList">
                    <p class="empty">No jobs.</p>
                </div>
            </div>
        </div>

        <div id="panel-create" class="tab-panel" hidden>
            <div class="card">
                <h2 id="formTitle">Create Job</h2>
                <input type="hidden" id="cJobId" />
                <div class="form">
                    <label>Source Cluster <select id="cSource">
                            <option value="">Select</option>
                        </select></label>
                    <label>Target Cluster <select id="cTarget">
                            <option value="">Select</option>
                        </select></label>
                    <label>VMs (comma VMIDs) <input type="text" id="cVms" placeholder="100,101" /></label>
                    <label>Schedule (cron) <input type="text" id="cSchedule" value="0 2 * * *" /></label>
                    <label class="toggle"><input type="checkbox" id="cEnabled" checked /> Enabled</label>
                    <button id="cSave">Create</button>
                    <button id="cCancel" class="secondary" hidden>Cancel</button>
                </div>
                <p id="cError" class="error-text"></p>
            </div>
        </div>

        <div id="panel-drift" class="tab-panel" hidden>
            <div class="card">
                <h2>Drift</h2>
                <div class="form">
                    <label>Job <select id="dJob">
                            <option value="">All</option>
                        </select></label>
                    <button id="dLoad">Load</button>
                </div>
                <p id="dError" class="error-text"></p>
                <div id="driftList">
                    <p class="empty">No drift.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
