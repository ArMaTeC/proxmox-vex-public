<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Carbon Footprint</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="estimate">Estimate</button>
            <button class="tab" role="tab" data-tab="live">Live</button>
            <button class="tab" role="tab" data-tab="estimates">Saved</button>
            <button class="tab" role="tab" data-tab="factor">Factor</button>
            <button class="tab" role="tab" data-tab="trends">Trends</button>
        </div>

        <div id="panel-estimate" class="tab-panel">
            <div class="card">
                <h2>Estimate CO₂</h2>
                <form class="form" id="estForm">
                    <label>Cluster <select id="eCluster" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>Hours <input type="number" id="eHours" value="1" min="0.1" step="0.1" /></label>
                    <label>Average kW <input type="number" id="eKw" value="1" min="0" step="0.1" /></label>
                    <button type="submit">Estimate</button>
                    <button type="button" id="eSave" class="secondary">Save</button>
                </form>
                <p id="eError" class="error-text"></p>
                <div id="eResult" class="card" hidden>
                    <h2>Result</h2>
                    <div class="grid" id="eMetrics"></div>
                </div>
            </div>
        </div>

        <div id="panel-live" class="tab-panel" hidden>
            <div class="card">
                <h2>Live cluster estimate</h2>
                <form class="form" id="liveForm">
                    <label>Cluster <select id="lCluster" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>Hours <input type="number" id="lHours" value="24" min="0.1" step="0.1" /></label>
                    <button type="submit">Scan cluster</button>
                    <button type="button" id="lSave" class="secondary">Save</button>
                </form>
                <p id="lError" class="error-text"></p>
                <div id="lResult" class="card" hidden>
                    <h2>Live result</h2>
                    <div class="grid" id="lMetrics"></div>
                    <p class="muted" id="lBreakdown"></p>
                </div>
            </div>
        </div>

        <div id="panel-estimates" class="tab-panel" hidden>
            <div class="card">
                <h2>Saved Estimates</h2>
                <div class="form">
                    <input type="text" id="esFilter" placeholder="Filter cluster" />
                </div>
                <div id="estimatesList">
                    <p class="empty">No estimates.</p>
                </div>
            </div>
        </div>

        <div id="panel-factor" class="tab-panel" hidden>
            <div class="card">
                <h2>Carbon Factor</h2>
                <div class="form">
                    <input type="number" id="fValue" value="0.4" min="0" step="0.01" />
                    <label>Preset <select id="fPreset">
                            <option value="">Custom</option>
                        </select></label>
                    <button id="fSet">Set</button>
                </div>
                <p id="fError" class="error-text"></p>
            </div>
        </div>

        <div id="panel-trends" class="tab-panel" hidden>
            <div class="card">
                <h2>Trends</h2>
                <div id="trendsList">
                    <p class="empty">No trends.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
