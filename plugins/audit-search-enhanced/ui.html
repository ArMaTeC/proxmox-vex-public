<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Enhanced Audit Search</title>
    <script src="/static/js/purify.min.js"></script>
    <script>if (!window.DOMPurify) { document.write('<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"><\/script>'); }</script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <a class="skip-link" href="#main-content" data-i18n="skip_content">Skip to main content</a>
    <main id="main-content" class="container">
        <header>
            <h1 data-i18n="title">Enhanced Audit Search</h1>
            <span class="status" id="status" data-i18n="status_loading">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" id="tab-search" role="tab" aria-selected="true" aria-controls="panel-search"
                data-tab="search" data-i18n="tab_search">Search</button>
            <button class="tab" id="tab-agg" role="tab" aria-controls="panel-agg" data-tab="agg"
                data-i18n="tab_aggregations">Aggregations</button>
            <button class="tab" id="tab-saved" role="tab" aria-controls="panel-saved" data-tab="saved"
                data-i18n="tab_saved">Saved</button>
        </div>

        <div id="panel-search" class="tab-panel">
            <div class="card">
                <h2>Search Audit Log</h2>
                <form class="form" id="searchForm">
                    <label for="sCluster"><span data-i18n="label_cluster">Cluster</span>
                        <select id="sCluster">
                            <option value="" data-i18n="option_all_clusters">All clusters</option>
                        </select></label>
                    <label for="sQuick"><span data-i18n="label_quick">Quick</span>
                        <select id="sQuick">
                            <option value="" data-i18n="option_custom">Custom</option>
                            <option value="today" data-i18n="option_today">Today</option>
                            <option value="7d" data-i18n="option_7d">Last 7 days</option>
                            <option value="30d" data-i18n="option_30d">Last 30 days</option>
                        </select></label>
                    <label for="sStart"><span data-i18n="label_start">Start</span>
                        <input type="datetime-local" id="sStart" /></label>
                    <label for="sEnd"><span data-i18n="label_end">End</span>
                        <input type="datetime-local" id="sEnd" /></label>
                    <label for="sUser"><span data-i18n="label_user">User</span>
                        <select id="sUser">
                            <option value="" data-i18n="option_all">All</option>
                        </select></label>
                    <label for="sText"><span data-i18n="label_text">Text</span>
                        <input type="text" id="sText" /></label>
                    <label for="sSeverity"><span data-i18n="label_severity">Severity</span>
                        <select id="sSeverity">
                            <option value="" data-i18n="option_all">All</option>
                            <option value="info">Info</option>
                            <option value="warning">Warning</option>
                            <option value="error">Error</option>
                        </select></label>
                    <label for="sAction"><span data-i18n="label_action">Action</span>
                        <input type="text" id="sAction" /></label>
                    <label for="sIp"><span data-i18n="label_ip">IP</span>
                        <input type="text" id="sIp" /></label>
                    <button type="submit" data-i18n="button_search">Search</button>
                    <button type="button" id="sSave" class="secondary" data-i18n="button_save_search">Save
                        search</button>
                    <button type="button" id="sExport" class="secondary" data-i18n="button_export">Export</button>
                </form>
                <p id="sError" class="error-text"></p>
                <div class="grid" id="metrics"></div>
                <div id="resultsList">
                    <p class="empty" data-i18n="empty_results">No results.</p>
                </div>
                <div class="pagination" id="pager"></div>
                <label class="page-size" for="pageSize"><span data-i18n="label_page_size">Page size</span>
                    <select id="pageSize">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                    </select></label>
            </div>
        </div>

        <div id="panel-agg" class="tab-panel" hidden>
            <div class="card">
                <h2>Aggregations</h2>
                <div class="grid" id="aggGrid"></div>
            </div>
        </div>

        <div id="panel-saved" class="tab-panel" hidden>
            <div class="card">
                <h2>Saved Searches</h2>
                <div id="savedList">
                    <p class="empty" data-i18n="empty_saved">No saved searches.</p>
                </div>
            </div>
        </div>
    </main>


    <div id="modalOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div id="modal" class="modal">
            <h3 id="modalTitle">Confirm</h3>
            <p id="modalBody"></p>
            <input type="text" id="modalInput" hidden />
            <div class="modal-actions">
                <button id="modalCancel" class="secondary" type="button" data-i18n="button_cancel">Cancel</button>
                <button id="modalOk" type="button" data-i18n="button_save">OK</button>
            </div>
        </div>
    </div>
    <script src="ui.js"></script>
</body>

</html>
