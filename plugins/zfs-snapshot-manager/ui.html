<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZFS Snapshot Manager</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>ZFS Snapshot Manager</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="snapshots">Snapshots</button>
            <button class="tab" role="tab" data-tab="prune">Prune</button>
            <button class="tab" role="tab" data-tab="history">History</button>
        </div>

        <div id="panel-snapshots" class="tab-panel">
            <div class="card">
                <h2>Create Snapshot</h2>
                <form class="form" id="snapForm">
                    <label>Dataset <input type="text" id="sDataset" list="datasets" required
                            placeholder="tank/vm-100" /></label>
                    <datalist id="datasets"></datalist>
                    <label>Name <input type="text" id="sName" required placeholder="manual-20260807" /></label>
                    <button type="submit">Create</button>
                </form>
                <p id="sError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Snapshots</h2>
                <div class="actions" style="margin-bottom:12px;">
                    <input type="text" id="zSearch" placeholder="Search dataset or name" />
                    <select id="zDataset">
                        <option value="">All datasets</option>
                    </select>
                    <button id="zPruneNow" class="secondary">Prune Now</button>
                </div>
                <div id="snapshotsList">
                    <p class="empty">No snapshots.</p>
                </div>
            </div>
        </div>

        <div id="panel-prune" class="tab-panel" hidden>
            <div class="card">
                <h2>Prune Snapshots</h2>
                <form class="form" id="pruneForm">
                    <label>Age (days) <input type="number" id="pAge" min="0" value="7" required /></label>
                    <label><input type="checkbox" id="pDry" checked /> Dry run</label>
                    <button type="submit">Run</button>
                </form>
                <p id="pError" class="error-text"></p>
                <div id="pruneResult"></div>
            </div>
            <div class="card">
                <h2>Prune Schedule</h2>
                <form class="form" id="scheduleForm">
                    <label>Cron <input type="text" id="schCron" placeholder="0 3 * * *" required /></label>
                    <label>Age (days) <input type="number" id="schAge" value="7" /></label>
                    <label><input type="checkbox" id="schEnabled" checked /> Enabled</label>
                    <button type="submit">Add</button>
                </form>
                <div id="schedulesList">
                    <p class="empty">No schedules.</p>
                </div>
            </div>
        </div>

        <div id="panel-history" class="tab-panel" hidden>
            <div class="card">
                <h2>Prune History</h2>
                <div id="historyList">
                    <p class="empty">No prune history.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
