<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLAN Provisioner</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 data-i18n="title">VLAN Provisioner</h1>
            <span class="status" id="statusText" aria-live="polite" data-i18n="loading">Loading…</span>
            <button id="refreshBtn" type="button" class="secondary" data-i18n="refresh">Refresh</button>
        </header>

        <div id="message" role="status" aria-live="polite"></div>
        <div id="errorBox" class="error-state hidden">
            <p id="errorText"></p>
            <button id="retryBtn" type="button" data-i18n="retry">Retry</button>
        </div>

        <div class="grid" role="region" aria-label="Status cards">
            <div class="card">
                <div class="title" data-i18n="status">Status</div>
                <div class="value" id="statusValue" aria-live="polite">-</div>
            </div>
            <div class="card">
                <div class="title" data-i18n="totalVlans">Total VLANs</div>
                <div class="value" id="vlanCount" aria-live="polite">-</div>
            </div>
            <div class="card">
                <div class="title" data-i18n="complianceStatus">Compliance</div>
                <div class="value" id="complianceValue" aria-live="polite">-</div>
            </div>
        </div>

        <nav class="tabs" role="tablist" aria-label="Plugin sections">
            <button class="tab active" role="tab" data-tab="vlans" aria-selected="true"
                data-i18n="addVlan">VLANs</button>
            <button class="tab" role="tab" data-tab="apply" data-i18n="applyToCluster">Apply</button>
            <button class="tab" role="tab" data-tab="compliance" data-i18n="compliance">Compliance</button>
            <button class="tab" role="tab" data-tab="range" data-i18n="vlanRangeGenerator">Range</button>
            <button class="tab" role="tab" data-tab="import" data-i18n="importExport">Import/Export</button>
            <button class="tab" role="tab" data-tab="topology" data-i18n="networkTopology">Topology</button>
            <button class="tab" role="tab" data-tab="audit" data-i18n="auditLog">Audit</button>
            <button class="tab" role="tab" data-tab="schedule" data-i18n="schedule">Schedule</button>
        </nav>

        <section id="vlans-tab" class="tab-panel active" role="tabpanel">
            <div class="section">
                <h2 data-i18n="addVlan">Add / Edit VLAN</h2>
                <form class="form" id="vlanForm">
                    <input type="hidden" id="editId" />
                    <label>
                        <span data-i18n="name">Name</span>
                        <input type="text" id="vlanName" required placeholder="prod-vlan-10" />
                    </label>
                    <label>
                        <span data-i18n="vid">VID</span>
                        <input type="number" id="vlanVid" required min="1" max="4094" placeholder="10" />
                    </label>
                    <label>
                        <span data-i18n="subnet">Subnet</span>
                        <input type="text" id="vlanSubnet" placeholder="10.0.10.0/24" />
                    </label>
                    <label>
                        <span data-i18n="description">Description</span>
                        <textarea id="vlanDescription" rows="2" placeholder="Production VLAN"></textarea>
                    </label>
                    <label>
                        <span data-i18n="tags">Tags</span>
                        <input type="text" id="vlanTags" placeholder="production, dmz" />
                    </label>
                    <label>
                        <span data-i18n="environment">Environment</span>
                        <select id="vlanEnvironment">
                            <option value=""></option>
                            <option value="production">production</option>
                            <option value="staging">staging</option>
                            <option value="development">development</option>
                            <option value="management">management</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="color">Color</span>
                        <input type="color" id="vlanColor" value="#58a6ff" />
                    </label>
                    <div class="actions">
                        <button type="submit" id="saveBtn" data-i18n="save">Save</button>
                        <button type="button" id="cancelBtn" class="secondary" data-i18n="cancel">Cancel</button>
                        <button type="button" id="duplicateBtn" class="secondary hidden"
                            data-i18n="duplicate">Duplicate</button>
                    </div>
                </form>
                <div id="formError" class="message error hidden"></div>
            </div>

            <div class="section">
                <div class="toolbar">
                    <input type="search" id="search" data-i18n-placeholder="search" placeholder="Search"
                        aria-label="Search VLANs" />
                    <select id="tagFilter" aria-label="Filter by tag">
                        <option value="" data-i18n="allTags">All tags</option>
                    </select>
                    <select id="envFilter" aria-label="Filter by environment">
                        <option value="" data-i18n="allEnvironments">All environments</option>
                    </select>
                    <select id="sortBy" aria-label="Sort by">
                        <option value="name" data-i18n="sortByName">Name</option>
                        <option value="vid" data-i18n="sortByVid">VID</option>
                        <option value="subnet" data-i18n="sortBySubnet">Subnet</option>
                        <option value="environment" data-i18n="sortByEnvironment">Environment</option>
                    </select>
                    <select id="orderBy" aria-label="Order">
                        <option value="asc" data-i18n="ascending">Ascending</option>
                        <option value="desc" data-i18n="descending">Descending</option>
                    </select>
                </div>
                <div class="bulk-bar">
                    <label><input type="checkbox" id="selectAll" aria-label="Select all" /> <span
                            data-i18n="selectAll">Select all</span></label>
                    <span id="selectedCount" class="muted"></span>
                    <button id="bulkDelete" type="button" class="secondary" data-i18n="bulkDelete">Bulk Delete</button>
                    <button id="bulkApply" type="button" class="secondary" data-i18n="bulkApply">Bulk Apply</button>
                    <button id="exportSelected" type="button" class="secondary" data-i18n="exportSelected">Export
                        Selected</button>
                </div>
                <div id="vlansList">
                    <p class="empty" data-i18n="noVlans">No VLANs configured yet.</p>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>

        <section id="apply-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="applyToCluster">Apply to Cluster</h2>
                <form class="form" id="applyForm">
                    <label>
                        <span data-i18n="cluster">Cluster</span>
                        <select id="applyCluster" required>
                            <option value="" data-i18n="selectCluster">Select a cluster</option>
                        </select>
                    </label>
                    <label>
                        <input type="checkbox" id="applyDryRun" /> <span data-i18n="dryRun">Dry run</span>
                    </label>
                    <button type="submit" id="applyBtn" data-i18n="apply">Apply</button>
                </form>
                <div id="applyVlanList" style="margin-bottom:12px;"></div>
                <div id="applyResult"></div>
            </div>
            <div class="section">
                <h2 data-i18n="bulkApplyToClusters">Bulk Apply to Clusters</h2>
                <form class="form" id="bulkApplyForm">
                    <label>
                        <span data-i18n="clusters">Clusters</span>
                        <select id="bulkClusters" multiple required size="5"></select>
                    </label>
                    <label>
                        <input type="checkbox" id="bulkDryRun" /> <span data-i18n="dryRun">Dry run</span>
                    </label>
                    <button type="submit" data-i18n="bulkApply">Bulk Apply</button>
                </form>
                <div id="bulkApplyResult"></div>
            </div>
        </section>

        <section id="compliance-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="complianceCheck">Compliance Check</h2>
                <form class="form" id="complianceForm">
                    <label>
                        <span data-i18n="cluster">Cluster</span>
                        <select id="complianceCluster" required>
                            <option value="" data-i18n="selectCluster">Select a cluster</option>
                        </select>
                    </label>
                    <button type="submit" data-i18n="runCheck">Run Check</button>
                </form>
                <div id="complianceResult"></div>
            </div>
        </section>

        <section id="range-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="vlanRangeGenerator">VLAN Range Generator</h2>
                <form class="form" id="rangeForm">
                    <label>
                        <span data-i18n="startVid">Start VID</span>
                        <input type="number" id="rangeStart" required min="1" max="4094" />
                    </label>
                    <label>
                        <span data-i18n="endVid">End VID</span>
                        <input type="number" id="rangeEnd" required min="1" max="4094" />
                    </label>
                    <label>
                        <span data-i18n="namePrefix">Name prefix</span>
                        <input type="text" id="rangePrefix" required placeholder="vlan" />
                    </label>
                    <label>
                        <span data-i18n="subnet">Subnet template (optional)</span>
                        <input type="text" id="rangeSubnet" placeholder="10.0.{vid}.0/24" />
                    </label>
                    <label>
                        <span data-i18n="description">Description</span>
                        <input type="text" id="rangeDescription" />
                    </label>
                    <label>
                        <span data-i18n="tags">Tags</span>
                        <input type="text" id="rangeTags" />
                    </label>
                    <label>
                        <span data-i18n="color">Color</span>
                        <input type="color" id="rangeColor" value="#58a6ff" />
                    </label>
                    <button type="submit" data-i18n="generate">Generate</button>
                </form>
                <div id="rangePreview"></div>
            </div>
        </section>

        <section id="import-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="importExport">Import / Export</h2>
                <div class="form">
                    <button id="exportJSON" type="button" data-i18n="exportJSON">JSON</button>
                    <button id="exportCSV" type="button" data-i18n="exportCSV">CSV</button>
                    <button id="exportSelected2" type="button" class="secondary" data-i18n="exportSelected">Export
                        Selected</button>
                </div>
                <form class="form" id="importForm">
                    <label>
                        <span data-i18n="import">Import JSON file</span>
                        <input type="file" id="importFile" accept=".json,.csv" />
                    </label>
                    <button type="submit" data-i18n="import">Import</button>
                </form>
                <div id="importResult"></div>
            </div>
        </section>

        <section id="topology-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="networkTopology">Network Topology</h2>
                <div id="topologyView"></div>
            </div>
        </section>

        <section id="audit-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="auditLog">Audit Log</h2>
                <div class="toolbar">
                    <select id="auditAction" aria-label="Filter by action">
                        <option value="" data-i18n="all">All</option>
                        <option value="create">create</option>
                        <option value="edit">edit</option>
                        <option value="delete">delete</option>
                        <option value="apply">apply</option>
                        <option value="compliance">compliance</option>
                        <option value="import">import</option>
                    </select>
                    <button id="loadAudit" type="button" data-i18n="refresh">Refresh</button>
                </div>
                <div id="auditView">
                    <p class="empty" data-i18n="noAudit">No audit events recorded.</p>
                </div>
            </div>
        </section>

        <section id="schedule-tab" class="tab-panel" role="tabpanel">
            <div class="section">
                <h2 data-i18n="schedule">Scheduled Compliance Scan</h2>
                <form class="form" id="scheduleForm">
                    <label>
                        <input type="checkbox" id="scheduleEnabled" /> <span data-i18n="enabled">Enabled</span>
                    </label>
                    <label>
                        <span data-i18n="intervalMinutes">Interval (minutes)</span>
                        <input type="number" id="scheduleInterval" min="1" value="60" />
                    </label>
                    <button type="submit" data-i18n="saveSchedule">Save Schedule</button>
                </form>
                <div id="scheduleResult"></div>
            </div>
        </section>
    </div>


    <script src="ui.js"></script>
</body>

</html>
