<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Chargeback</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Cost Chargeback</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="rates">Rates</button>
            <button class="tab" role="tab" data-tab="report">Report</button>
            <button class="tab" role="tab" data-tab="summary">Tenants</button>
            <button class="tab" role="tab" data-tab="invoices">Invoices</button>
        </div>

        <div id="panel-rates" class="tab-panel">
            <div class="card">
                <h2>Rates</h2>
                <form class="form" id="rateForm">
                    <label>CPU / core-hr <input type="number" id="rCpu" step="0.001" required /></label>
                    <label>RAM / GB-hr <input type="number" id="rRam" step="0.001" required /></label>
                    <label>Storage / GB-hr <input type="number" id="rStorage" step="0.0001" required /></label>
                    <label>Network / GB <input type="number" id="rNet" step="0.001" required /></label>
                    <label>Power / kWh <input type="number" id="rPower" step="0.001" required /></label>
                    <button type="submit">Set Rates</button>
                    <button type="button" id="rReset" class="secondary">Reset</button>
                </form>
                <p id="rError" class="error-text"></p>
                <div class="grid" id="rateCards"></div>
            </div>
        </div>

        <div id="panel-report" class="tab-panel" hidden>
            <div class="card">
                <h2>Cluster Report</h2>
                <div class="form">
                    <label>Cluster <select id="cCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>From <input type="date" id="cFrom" /></label>
                    <label>To <input type="date" id="cTo" /></label>
                    <button id="cLoad">Load</button>
                </div>
                <p id="cError" class="error-text"></p>
                <div id="reportResult">
                    <p class="empty">No report loaded.</p>
                </div>
            </div>
        </div>

        <div id="panel-summary" class="tab-panel" hidden>
            <div class="card">
                <h2>Tenant Summary</h2>
                <div class="form">
                    <label>Cluster <select id="sCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>From <input type="date" id="sFrom" /></label>
                    <label>To <input type="date" id="sTo" /></label>
                    <button id="sLoad">Load</button>
                </div>
                <p id="sError" class="error-text"></p>
                <div id="summaryResult">
                    <p class="empty">No summary loaded.</p>
                </div>
            </div>
        </div>

        <div id="panel-invoices" class="tab-panel" hidden>
            <div class="card">
                <h2>Generate Invoice</h2>
                <div class="form">
                    <label>Cluster <select id="iCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>Tenant <input type="text" id="iTenant" /></label>
                    <label>Period <input type="text" id="iPeriod" placeholder="2026-08" /></label>
                    <label>Total <input type="number" id="iTotal" step="0.01" min="0" /></label>
                    <button id="iCreate">Generate</button>
                </div>
                <p id="iError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Invoices</h2>
                <div id="invoicesList">
                    <p class="empty">No invoices.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
