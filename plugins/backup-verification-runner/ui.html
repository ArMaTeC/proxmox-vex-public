<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Verification Runner</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Backup Verification Runner</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="verify">Run</button>
            <button class="tab" role="tab" data-tab="schedule">Schedules</button>
            <button class="tab" role="tab" data-tab="results">Results</button>
            <button class="tab" role="tab" data-tab="history">History</button>
        </div>

        <div id="panel-verify" class="tab-panel">
            <div class="card">
                <h2>Run Verification</h2>
                <form class="form" id="verifyForm">
                    <label>Cluster <select id="vCluster" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>VM <select id="vVm" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>Backup <select id="vBackup" required>
                            <option value="">Select</option>
                        </select></label>
                    <button type="submit" id="vRun">Verify</button>
                </form>
                <p id="vError" class="error-text"></p>
                <div id="verifyResult" class="card" hidden>
                    <h2>Result</h2>
                    <div class="grid" id="resMetrics"></div>
                </div>
            </div>
        </div>

        <div id="panel-schedule" class="tab-panel" hidden>
            <div class="card">
                <h2>Schedule Verification</h2>
                <form class="form" id="scheduleForm">
                    <label>Cluster <select id="sCluster" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>VM <select id="sVm" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>Backup <select id="sBackup" required>
                            <option value="">Select</option>
                        </select></label>
                    <label>Frequency <select id="sFreq">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select></label>
                    <label>Cron (optional) <input type="text" id="sCron" placeholder="0 2 * * *" /></label>
                    <button type="submit">Schedule</button>
                </form>
                <p id="sError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Schedules</h2>
                <div id="schedulesList">
                    <p class="empty">No schedules.</p>
                </div>
            </div>
        </div>

        <div id="panel-results" class="tab-panel" hidden>
            <div class="card">
                <h2>Results</h2>
                <div class="form">
                    <label>Cluster <input type="text" id="rCluster" placeholder="Filter" /></label>
                    <label>VM <input type="text" id="rVm" placeholder="Filter" /></label>
                    <label>Status <select id="rStatus">
                            <option value="">All</option>
                            <option value="ok">OK</option>
                            <option value="fail">Fail</option>
                        </select></label>
                    <button id="rLoad">Load</button>
                </div>
                <div id="resultsList">
                    <p class="empty">No results.</p>
                </div>
            </div>
        </div>

        <div id="panel-history" class="tab-panel" hidden>
            <div class="card">
                <h2>Pass/Fail History</h2>
                <div class="grid" id="historyGrid"></div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
