<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCI Passthrough Catalog</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>PCI Passthrough Catalog</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="devices">Devices</button>
            <button class="tab" role="tab" data-tab="assignments">Assignments</button>
        </div>

        <div id="panel-devices" class="tab-panel">
            <div class="grid">
                <div class="stat">
                    <div class="muted">Total Devices</div>
                    <div class="num" id="sTotal">0</div>
                </div>
                <div class="stat">
                    <div class="muted">Assigned</div>
                    <div class="num" id="sAssigned">0</div>
                </div>
            </div>
            <div class="card">
                <h2>Scan for PCI Devices</h2>
                <div class="form">
                    <label>Cluster <select id="dCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>Node <select id="dNode">
                            <option value="">All</option>
                        </select></label>
                    <label>Search <input type="text" id="dSearch" placeholder="name or device id" /></label>
                    <button id="dScan">Scan</button>
                </div>
                <p id="dError" class="error-text"></p>
                <div id="dList">
                    <p class="empty">No devices scanned.</p>
                </div>
            </div>
            <div id="detailPanel" class="card" hidden>
                <h2>Device Details</h2>
                <div id="dDetail"></div>
            </div>
        </div>

        <div id="panel-assignments" class="tab-panel" hidden>
            <div class="card">
                <h2>Assignments</h2>
                <div class="form">
                    <label>Node <select id="aNode">
                            <option value="">All</option>
                        </select></label>
                    <label>VMID <input type="text" id="aVmid" placeholder="100" /></label>
                    <button id="aLoad" class="secondary">Refresh</button>
                </div>
                <div id="aList">
                    <p class="empty">No assignments.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
