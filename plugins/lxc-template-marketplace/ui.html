<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXC Template Marketplace</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>LXC Template Marketplace</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="catalog">Catalog</button>
            <button class="tab" role="tab" data-tab="add">Add/Edit</button>
            <button class="tab" role="tab" data-tab="import">Import</button>
            <button class="tab" role="tab" data-tab="public">Public</button>
        </div>

        <div id="panel-catalog" class="tab-panel">
            <div class="card">
                <h2>Catalog</h2>
                <div class="form">
                    <label>Search <input type="text" id="catSearch" placeholder="ID or name" /></label>
                    <label>OS <select id="catOs">
                            <option value="">All</option>
                        </select></label>
                    <label>Arch <select id="catArch">
                            <option value="">All</option>
                        </select></label>
                    <label>Source <select id="catSource">
                            <option value="">All</option>
                            <option value="local">Local</option>
                            <option value="url">URL</option>
                        </select></label>
                    <label>Sort <select id="catSort">
                            <option value="name">Name</option>
                            <option value="os">OS</option>
                            <option value="arch">Arch</option>
                        </select></label>
                    <button id="catLoad">Refresh</button>
                </div>
                <div id="catalogList">
                    <p class="empty">No templates.</p>
                </div>
            </div>
        </div>

        <div id="panel-add" class="tab-panel" hidden>
            <div class="card">
                <h2 id="addTitle">Add Template</h2>
                <input type="hidden" id="tIdH" />
                <div class="form">
                    <label>ID <input type="text" id="tId" placeholder="debian-12" /></label>
                    <label>Name <input type="text" id="tName" placeholder="Debian 12" /></label>
                    <label>OS <select id="tOs">
                            <option value="debian">Debian</option>
                            <option value="ubuntu">Ubuntu</option>
                            <option value="alpine">Alpine</option>
                            <option value="centos">CentOS</option>
                            <option value="other">Other</option>
                        </select></label>
                    <label>Arch <input type="text" id="tArch" placeholder="amd64" /></label>
                    <label>Version <input type="text" id="tVersion" placeholder="12" /></label>
                    <label>Source <input type="text" id="tSource"
                            placeholder="local:vztmpl/debian-12.tar.zst" /></label>
                    <label>Description <textarea id="tDesc" rows="2"
                            placeholder="Template description"></textarea></label>
                    <label>Metadata (JSON) <textarea id="tMeta" rows="3"
                            placeholder='{"key":"value"}'></textarea></label>
                    <button id="tSave">Save</button>
                    <button id="tCancel" class="secondary" hidden>Cancel</button>
                </div>
                <p id="tError" class="error-text"></p>
            </div>
        </div>

        <div id="panel-import" class="tab-panel" hidden>
            <div class="card">
                <h2>Import Template</h2>
                <div class="form">
                    <label>Template <select id="iTmpl">
                            <option value="">Select</option>
                        </select></label>
                    <label>Cluster <select id="iCluster">
                            <option value="">Select</option>
                        </select></label>
                    <button id="iImport">Import</button>
                </div>
                <p id="iError" class="error-text"></p>
                <div id="iResult">
                    <p class="empty">No import queued.</p>
                </div>
            </div>
        </div>

        <div id="panel-public" class="tab-panel" hidden>
            <div class="card">
                <h2>Pull from Public List</h2>
                <div class="form">
                    <label>List <select id="pList">
                            <option value="">Custom URL</option>
                        </select></label>
                    <label>URL <input type="text" id="pUrl"
                            placeholder="https://example.com/lxc-templates.json" /></label>
                    <button id="pPull">Pull</button>
                </div>
                <p id="pError" class="error-text"></p>
                <div id="pResult">
                    <p class="empty">No public list pulled.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-card">
            <h2 id="mTitle">Details</h2>
            <pre id="mBody" class="muted" style="white-space: pre-wrap;"></pre>
            <button id="mClose" class="secondary">Close</button>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
