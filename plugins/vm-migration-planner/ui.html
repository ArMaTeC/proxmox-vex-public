<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Migration Planner</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 data-i18n="title">VM Migration Planner</h1>
            <div class="actions">
                <span class="status" id="status">Loading...</span>
                <button id="refreshBtn" type="button" data-i18n="refresh">Refresh</button>
            </div>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div id="message"></div>
        <div id="globalError" class="card" hidden>
            <h2 data-i18n="errorTitle">Something went wrong</h2>
            <p id="globalErrorText"></p>
            <button id="globalRetry" type="button" data-i18n="retry">Retry</button>
        </div>
        <div class="stats" id="stats"></div>

        <div class="tabs" role="tablist" aria-label="VM Migration Planner sections">
            <button class="tab" role="tab" aria-selected="true" data-tab="nodes" data-i18n="tabNodes">Node Load</button>
            <button class="tab" role="tab" data-tab="plan" data-i18n="tabPlan">Plan</button>
            <button class="tab" role="tab" data-tab="recommendations" data-i18n="tabRecommend">Recommendations</button>
            <button class="tab" role="tab" data-tab="history" data-i18n="tabHistory">History</button>
            <button class="tab" role="tab" data-tab="settings" data-i18n="tabSettings">Settings</button>
        </div>

        <div id="panel-nodes" class="tab-panel">
            <div class="card">
                <h2 data-i18n="nodeLoadTitle">Node Load</h2>
                <form class="form" id="nodesForm">
                    <label>
                        <span data-i18n="cluster">Cluster</span>
                        <select name="cluster_id" id="nodesCluster" required></select>
                    </label>
                    <button type="submit" data-i18n="load">Load</button>
                </form>
                <div id="nodesFilters"></div>
                <div id="nodesChart" class="chart" hidden></div>
                <div id="nodesList">
                    <p class="empty" data-i18n="noNodes">Select a cluster to load nodes.</p>
                </div>
                <p class="muted" id="nodesRefresh"></p>
            </div>
        </div>

        <div id="panel-plan" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="planTitle">Plan Migration</h2>
                <form class="form" id="planForm">
                    <label>
                        <span data-i18n="cluster">Cluster</span>
                        <select name="cluster_id" id="planCluster" required></select>
                    </label>
                    <label>
                        <span data-i18n="vm">VM</span>
                        <select name="vmid" id="planVm" required></select>
                    </label>
                    <label>
                        <span data-i18n="targetOverride">Target override</span>
                        <select name="target" id="planTarget">
                            <option value="" data-i18n="auto">Auto</option>
                        </select>
                    </label>
                    <button type="submit" data-i18n="planBtn">Plan</button>
                </form>
                <div id="planResult"></div>
            </div>

            <div class="card">
                <h2 data-i18n="multiPlanTitle">Multi-Plan</h2>
                <div id="multiPlanList">
                    <p class="empty" data-i18n="noPlans">No plans yet.</p>
                </div>
                <div class="actions" style="margin-top:12px;">
                    <button id="dryRunBtn" type="button" class="secondary" data-i18n="dryRun">Dry Run</button>
                    <button id="executeBtn" type="button" data-i18n="execute">Execute</button>
                </div>
                <div id="dryRunResult"></div>
            </div>
        </div>

        <div id="panel-recommendations" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="recommendationsTitle">Recommendations</h2>
                <form class="form" id="recForm">
                    <label>
                        <span data-i18n="cluster">Cluster</span>
                        <select name="cluster_id" id="recCluster" required></select>
                    </label>
                    <label>
                        <span data-i18n="policy">Policy</span>
                        <select name="policy" id="recPolicy">
                            <option value="balance_cpu" data-i18n="policyCpu">Balance CPU</option>
                            <option value="balance_mem" data-i18n="policyMem">Balance memory</option>
                        </select>
                    </label>
                    <button type="submit" data-i18n="load">Load</button>
                </form>
                <div id="recList">
                    <p class="empty" data-i18n="noRecommendations">No recommendations.</p>
                </div>
            </div>
        </div>

        <div id="panel-history" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="historyTitle">Migration History</h2>
                <div id="historyList">
                    <p class="empty" data-i18n="noHistory">No migration jobs yet.</p>
                </div>
            </div>
        </div>

        <div id="panel-settings" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="settingsTitle">Settings</h2>
                <form class="form" id="settingsForm">
                    <label>
                        <span data-i18n="policy">Default policy</span>
                        <select name="policy" id="setPolicy">
                            <option value="balance_cpu" data-i18n="policyCpu">Balance CPU</option>
                            <option value="balance_mem" data-i18n="policyMem">Balance memory</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="excludedNodes">Excluded nodes</span>
                        <input type="text" name="excluded_nodes" id="setExcluded" placeholder="pve3, pve4" />
                    </label>
                    <label>
                        <span data-i18n="pinnedVms">Pinned VMIDs</span>
                        <input type="text" name="pinned_vms" id="setPinned" placeholder="100, 101" />
                    </label>
                    <button type="submit" data-i18n="save">Save</button>
                    <button id="exportBtn" type="button" class="secondary" data-i18n="export">Export</button>
                    <button id="importBtn" type="button" class="secondary" data-i18n="import">Import</button>
                </form>
                <input type="file" id="importFile" accept=".json" class="live" />
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
