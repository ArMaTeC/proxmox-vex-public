<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Hibernate Scheduler</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 data-i18n="title">VM Hibernate Scheduler</h1>
            <div class="actions">
                <span class="status" id="status">Loading...</span>
                <button id="refreshBtn" type="button" data-i18n="refresh" aria-label="Refresh data">Refresh</button>
            </div>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div id="message"></div>
        <div id="globalError" class="card" hidden>
            <h2 data-i18n="errorTitle">Something went wrong</h2>
            <p id="globalErrorText"></p>
            <button id="globalRetry" type="button" data-i18n="retry">Retry</button>
        </div>
        <div class="stats" id="stats"></div>

        <div class="tabs" role="tablist" aria-label="VM Hibernate Scheduler sections">
            <button class="tab" role="tab" aria-selected="true" data-tab="schedules"
                data-i18n="tabSchedules">Schedules</button>
            <button class="tab" role="tab" data-tab="history" data-i18n="tabHistory">History</button>
            <button class="tab" role="tab" data-tab="vmstatus" data-i18n="tabVmStatus">VM Status</button>
            <button class="tab" role="tab" data-tab="audit" data-i18n="tabAudit">Audit</button>
            <button class="tab" role="tab" data-tab="calendar" data-i18n="tabCalendar">Calendar</button>
        </div>

        <div id="panel-schedules" class="tab-panel">
            <div class="card">
                <h2 id="formTitle" data-i18n="createSchedule">Create Schedule</h2>
                <form id="scheduleForm" aria-label="Schedule form">
                    <div class="form-grid">
                        <label>
                            <span data-i18n="scheduleId">Schedule ID</span>
                            <input type="text" name="id" id="scheduleId" placeholder="daily-hibernate" />
                            <span id="idError" class="error-text" role="alert"></span>
                        </label>
                        <label>
                            <span data-i18n="cluster">Cluster</span>
                            <select name="cluster_id" id="clusterSelect"></select>
                        </label>
                        <label>
                            <span data-i18n="action">Action</span>
                            <select name="action" id="actionSelect">
                                <option value="hibernate" data-i18n="actionHibernate">Hibernate</option>
                                <option value="resume" data-i18n="actionResume">Resume</option>
                            </select>
                        </label>
                        <label>
                            <span data-i18n="cron">Cron</span>
                            <input type="text" name="cron" id="cronInput" placeholder="0 2 * * *" />
                            <select id="cronPreset" style="margin-top:4px;">
                                <option value="" data-i18n="preset">Quick preset</option>
                                <option value="0 2 * * *">Nightly 02:00</option>
                                <option value="0 22 * * 1-5">Weekdays 22:00</option>
                                <option value="0 3 * * 0,6">Weekends 03:00</option>
                                <option value="0 */4 * * *">Every 4 hours</option>
                            </select>
                            <span id="cronDesc" class="muted"></span>
                        </label>
                        <label>
                            <span data-i18n="timezone">Timezone</span>
                            <select name="timezone" id="timezoneSelect">
                                <option value="UTC">UTC</option>
                                <option value="America/New_York">America/New_York</option>
                                <option value="Europe/London">Europe/London</option>
                                <option value="Europe/Berlin">Europe/Berlin</option>
                                <option value="Asia/Tokyo">Asia/Tokyo</option>
                                <option value="Australia/Sydney">Australia/Sydney</option>
                            </select>
                        </label>
                        <label>
                            <span data-i18n="oneTime">One-time run (optional)</span>
                            <input type="datetime-local" name="one_time" id="oneTimeInput" />
                        </label>
                        <label>
                            <span data-i18n="enabled">Enabled</span>
                            <select name="enabled" id="enabledSelect">
                                <option value="true" data-i18n="enabledYes">Yes</option>
                                <option value="false" data-i18n="enabledNo">No</option>
                            </select>
                        </label>
                        <label>
                            <span data-i18n="description">Description</span>
                            <textarea name="description" id="descriptionInput"></textarea>
                        </label>
                        <label>
                            <span data-i18n="tags">Tags (comma-separated)</span>
                            <input type="text" name="tags" id="tagsInput" placeholder="prod, backup" />
                        </label>
                    </div>

                    <label>
                        <span data-i18n="targets">Target VMs</span>
                        <div class="vm-list" id="vmList" role="group" aria-label="VM picker"></div>
                        <span id="targetsError" class="error-text" role="alert"></span>
                    </label>

                    <div class="card" style="margin-top:12px; padding:12px;">
                        <strong data-i18n="exclusionWindows">Exclusion windows</strong>
                        <div id="windowsList" class="windows-list"></div>
                        <div class="btn-row">
                            <button type="button" id="addWindow" data-i18n="addWindow">Add window</button>
                        </div>
                    </div>

                    <div id="impact" class="impact" hidden>
                        <strong data-i18n="impact">Impact summary</strong>
                        <div id="impactText"></div>
                    </div>

                    <div class="btn-row">
                        <button type="submit" id="saveBtn" data-i18n="save">Save</button>
                        <button type="button" id="dryRunBtn" class="secondary" data-i18n="dryRun">Dry Run</button>
                        <button type="button" id="resetBtn" class="secondary" data-i18n="cancel">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2 data-i18n="schedulesTitle">Schedules</h2>
                <div class="filters" id="scheduleFilters"></div>
                <div id="schedulesList">
                    <p class="empty" data-i18n="noSchedules">No schedules.</p>
                </div>
                <div id="schedulePagination" class="pagination"></div>
            </div>
        </div>

        <div id="panel-history" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="historyTitle">Run History</h2>
                <div class="filters" id="historyFilters"></div>
                <div id="historyList">
                    <p class="empty" data-i18n="noRuns">No runs yet.</p>
                </div>
                <div id="historyPagination" class="pagination"></div>
            </div>
        </div>

        <div id="panel-vmstatus" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="vmStatusTitle">VM Status</h2>
                <div class="filters" id="vmStatusFilters"></div>
                <div id="vmStatusList">
                    <p class="empty" data-i18n="noVms">No VMs found.</p>
                </div>
            </div>
        </div>

        <div id="panel-audit" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="auditTitle">Audit Log</h2>
                <div id="auditList">
                    <p class="empty" data-i18n="noAudit">No audit events.</p>
                </div>
            </div>
        </div>

        <div id="panel-calendar" class="tab-panel" hidden>
            <div class="card">
                <h2 data-i18n="calendarTitle">Upcoming Events</h2>
                <div id="calendarList">
                    <p class="empty" data-i18n="calendarNoEvents">No upcoming events.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal">
            <h2 id="confirmTitle" data-i18n="confirmTitle">Confirm</h2>
            <p id="confirmText"></p>
            <div class="btn-row">
                <button id="confirmOk" type="button" data-i18n="confirm">Yes</button>
                <button id="confirmCancel" type="button" class="secondary" data-i18n="cancel">Cancel</button>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
