<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Passthrough Catalog</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>GPU Passthrough Catalog</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="scan">Scan</button>
            <button class="tab" role="tab" data-tab="assignments">Assignments</button>
            <button class="tab" role="tab" data-tab="action">Assign / Release</button>
        </div>

        <div id="panel-scan" class="tab-panel">
            <div class="card">
                <h2>Scan Cluster for GPUs</h2>
                <div class="form">
                    <label>Cluster <select id="sCluster">
                            <option value="">Select</option>
                        </select></label>
                    <button id="sScan">Scan</button>
                </div>
                <p id="sError" class="error-text"></p>
                <div class="form">
                    <label>Filter by node <select id="sNode">
                            <option value="">All</option>
                        </select></label>
                    <label>Filter by status <select id="sStatus">
                            <option value="">All</option>
                            <option value="available">Available</option>
                            <option value="assigned">Assigned</option>
                        </select></label>
                    <label>Search <input type="text" id="sSearch" placeholder="name or device ID" /></label>
                    <button id="sReset" class="secondary">Reset</button>
                </div>
                <div id="devicesList">
                    <p class="empty">No GPUs scanned yet.</p>
                </div>
            </div>
        </div>

        <div id="panel-assignments" class="tab-panel" hidden>
            <div class="card">
                <h2>Assignments</h2>
                <div class="form">
                    <label>Cluster <select id="aFilterCluster">
                            <option value="">All</option>
                        </select></label>
                    <label>Node <select id="aFilterNode">
                            <option value="">All</option>
                        </select></label>
                    <label>VMID <input type="text" id="aFilterVmid" /></label>
                    <button id="aLoad">Refresh</button>
                </div>
                <p id="aError" class="error-text"></p>
                <div id="assignmentsList">
                    <p class="empty">No assignments.</p>
                </div>
            </div>
        </div>

        <div id="panel-action" class="tab-panel" hidden>
            <div class="card">
                <h2 id="actTitle">Assign / Release GPU</h2>
                <div class="form">
                    <label>Cluster <select id="actCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>Node <input type="text" id="actNode" value="pve1" /></label>
                    <label>VMID <input type="text" id="actVmid" placeholder="100" /></label>
                    <label>Device ID <input type="text" id="actDevice" placeholder="0000:00:1e.0" /></label>
                    <label class="inline"><input type="checkbox" id="optPcie" /> PCIe</label>
                    <label class="inline"><input type="checkbox" id="optXvga" /> Primary GPU</label>
                    <label class="inline"><input type="checkbox" id="optRombar" checked /> Expose ROM bar</label>
                    <label>mdev type (optional) <input type="text" id="optMdev" placeholder="e.g. nvidia-46" /></label>
                    <label>Action <select id="actAction">
                            <option value="assign">Assign</option>
                            <option value="release">Release</option>
                        </select></label>
                    <button id="actRun">Run</button>
                </div>
                <p id="actError" class="error-text"></p>
                <div id="actResult">
                    <p class="empty">No action.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
