<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxmox HA Resources</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Proxmox HA Resources</h1>
            <span class="muted" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="resources">Resources</button>
            <button class="tab" role="tab" data-tab="add">Add / Update</button>
        </div>

        <div id="panel-resources" class="tab-panel">
            <div class="grid">
                <div class="stat">
                    <div class="muted">Total</div>
                    <div class="num" id="sTotal">0</div>
                </div>
                <div class="stat">
                    <div class="muted">Started</div>
                    <div class="num" id="sStarted">0</div>
                </div>
            </div>
            <div class="card">
                <h2>HA Resources</h2>
                <div class="form">
                    <label>Cluster <select id="rCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>State <select id="rState">
                            <option value="">All</option>
                            <option value="started">Started</option>
                            <option value="stopped">Stopped</option>
                            <option value="enabled">Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select></label>
                    <label>Search <input type="text" id="rSearch" placeholder="SID" /></label>
                    <button id="rLoad" class="secondary">Load</button>
                </div>
                <p id="rError" class="error-text"></p>
                <div id="rList">
                    <p class="empty">No resources.</p>
                </div>
            </div>
        </div>

        <div id="panel-add" class="tab-panel" hidden>
            <div class="card">
                <h2>Add / Update HA Resource</h2>
                <div class="form">
                    <label>Cluster <select id="aCluster">
                            <option value="">Select</option>
                        </select></label>
                    <label>SID (e.g. vm:100) <input type="text" id="aSid" placeholder="vm:100" /></label>
                    <label>State <select id="aState">
                            <option value="started">Started</option>
                            <option value="stopped">Stopped</option>
                            <option value="enabled">Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select></label>
                    <label>Max Restart <input type="number" id="aRestart" value="1" min="0" /></label>
                    <label>Max Relocate <input type="number" id="aRelocate" value="1" min="0" /></label>
                    <button id="aSave">Save</button>
                </div>
                <p id="aError" class="error-text"></p>
                <pre id="aResult" class="muted"></pre>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
