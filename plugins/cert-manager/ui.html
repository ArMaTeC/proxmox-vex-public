<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Manager</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Certificate Manager</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="certs">Certificates</button>
            <button class="tab" role="tab" data-tab="expiry">Expiry</button>
            <button class="tab" role="tab" data-tab="alerts">Alerts</button>
        </div>

        <div id="panel-certs" class="tab-panel">
            <div class="card">
                <h2>Request Certificate</h2>
                <form class="form" id="certForm">
                    <input type="hidden" id="cId" />
                    <label>Domain <input type="text" id="cDomain" placeholder="example.com" required /></label>
                    <label>SANs (JSON array) <input type="text" id="cSans" placeholder='["*.example.com"]' /></label>
                    <label>Description <input type="text" id="cDesc" /></label>
                    <label>Provider <select id="cProvider">
                            <option value="acme-v2">ACME v2</option>
                            <option value="acme-v1">ACME v1</option>
                        </select></label>
                    <button type="submit">Request</button>
                    <button type="button" id="cReset" class="secondary">Reset</button>
                </form>
                <p id="cError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Certificates</h2>
                <div class="form">
                    <label>Filter status <select id="cFilter">
                            <option value="">All</option>
                            <option value="pending">Pending</option>
                            <option value="active">Active</option>
                            <option value="expired">Expired</option>
                        </select></label>
                    <input type="text" id="cSearch" placeholder="Filter domain" />
                </div>
                <div id="certsList">
                    <p class="empty">No certificates.</p>
                </div>
                <div id="deployForm" hidden>
                    <h3>Deploy</h3>
                    <div class="form">
                        <input type="hidden" id="dId" />
                        <label>Node <select id="dNode">
                                <option value="">Select</option>
                            </select></label>
                        <button id="dSubmit">Deploy</button>
                    </div>
                    <p id="dError" class="error-text"></p>
                </div>
            </div>
        </div>

        <div id="panel-expiry" class="tab-panel" hidden>
            <div class="card">
                <h2>Check Expiry</h2>
                <div class="form">
                    <label>Days <input type="number" id="eDays" value="30" min="1" /></label>
                    <button id="eCheck">Check</button>
                </div>
                <div id="expiryList">
                    <p class="empty">No expiring certificates.</p>
                </div>
            </div>
        </div>

        <div id="panel-alerts" class="tab-panel" hidden>
            <div class="card">
                <h2>Expiry Alert</h2>
                <div class="form">
                    <label>Threshold (days) <input type="number" id="aDays" value="30" min="1" /></label>
                    <label>Target <input type="text" id="aTarget" placeholder="admin@example.com" /></label>
                    <button id="aSave">Save</button>
                </div>
                <p id="aError" class="error-text"></p>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
