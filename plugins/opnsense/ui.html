<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPNsense Manager</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>OPNsense Manager</h1>
            <div style="display:flex;gap:12px;align-items:center">
                <select id="hostSelect"></select>
                <span id="hostChip" class="chip">Healthy</span>
                <span id="versionChip" class="chip ok">—</span>
                <button id="refreshAll">Refresh</button>
            </div>
        </header>
        <div id="message"></div>

        <div class="tabs">
            <div class="tab active" data-tab="overview" data-i18n="overview">Overview</div>
            <div class="tab" data-tab="network" data-i18n="network">Network</div>
            <div class="tab" data-tab="vpn" data-i18n="vpn">VPN</div>
            <div class="tab" data-tab="nat" data-i18n="nat">NAT</div>
            <div class="tab" data-tab="dns" data-i18n="dns">DNS</div>
            <div class="tab" data-tab="dhcp" data-i18n="dhcp">DHCP</div>
            <div class="tab" data-tab="wg" data-i18n="wg">WG Peers</div>
            <div class="tab" data-tab="logs" data-i18n="logs">Logs</div>
            <div class="tab" data-tab="gateways" data-i18n="gateways">Gateways</div>
        </div>

        <div class="panel active" id="overviewPanel">
            <div class="grid" id="overviewStats"></div>
            <div class="card">
                <h2 data-i18n="host">Host</h2>
                <p class="muted" id="overviewHost"></p>
            </div>
        </div>

        <div class="panel" id="networkPanel">
            <div class="card">
                <h2 data-i18n="interfaces">Interfaces</h2>
                <div id="interfacesList">
                    <p class="empty">No interfaces.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="vpnPanel">
            <div class="card">
                <h2 data-i18n="vpn">VPN Tunnels</h2>
                <div id="vpnsList">
                    <p class="empty">No VPNs.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="natPanel">
            <div class="card">
                <h2 data-i18n="nat">NAT Rules</h2>
                <div class="toolbar"><input type="text" id="natSearch" placeholder="Search NAT rules..." /></div>
                <div id="natList">
                    <p class="empty">No NAT rules.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="dnsPanel">
            <div class="card">
                <h2 data-i18n="dns">DNS Overrides</h2>
                <form class="form" id="dnsForm">
                    <label>Host record <input type="text" name="host_record" required /></label>
                    <label>IP <input type="text" name="ip" required /></label>
                    <button type="submit" data-i18n="add">Add</button>
                </form>
                <div id="dnsList">
                    <p class="empty">No DNS overrides.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="dhcpPanel">
            <div class="card">
                <h2 data-i18n="dhcp">DHCP Leases</h2>
                <div class="toolbar">
                    <select id="leaseActive">
                        <option value="">All</option>
                        <option value="true">Active</option>
                        <option value="false">Reserved</option>
                    </select>
                    <button id="dhcpRefresh">Refresh</button>
                </div>
                <div id="dhcpList">
                    <p class="empty">No DHCP leases.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="wgPanel">
            <div class="card">
                <h2 data-i18n="wg">WireGuard Peers</h2>
                <div id="wgList">
                    <p class="empty">No peers.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="logsPanel">
            <div class="card">
                <h2 data-i18n="logs">Logs</h2>
                <div class="toolbar">
                    <input type="text" id="logSearch" placeholder="Search logs..." />
                    <select id="logSeverity">
                        <option value="">All</option>
                        <option value="notice">Notice</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                    </select>
                    <button id="logRefresh">Refresh</button>
                </div>
                <div id="logsList">
                    <p class="empty">No logs.</p>
                </div>
            </div>
        </div>

        <div class="panel" id="gatewaysPanel">
            <div class="card">
                <h2 data-i18n="gateways">Gateways</h2>
                <div id="gatewaysList">
                    <p class="empty">No gateways.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
