<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPS Monitor</title>
    <script src="/static/js/purify.min.js"></script>
    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 id="pageTitle">UPS Monitor</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="grid" id="metrics"></div>

        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="status" id="tab-status">Status</button>
            <button class="tab" role="tab" data-tab="devices" id="tab-devices">Devices</button>
            <button class="tab" role="tab" data-tab="events" id="tab-events">Events</button>
        </div>

        <div id="panel-status" class="tab-panel">
            <div class="card">
                <h2 id="readingsTitle">Live readings</h2>
                <div class="actions" style="margin-bottom:12px;">
                    <button id="btnRefresh">Refresh Now</button>
                </div>
                <div id="readingsList">
                    <p class="empty">No readings.</p>
                </div>
            </div>
        </div>

        <div id="panel-devices" class="tab-panel" hidden>
            <div class="card">
                <h2 id="deviceFormTitle">Add Device</h2>
                <form class="form" id="deviceForm">
                    <input type="hidden" id="dOld" />
                    <label>Name <input type="text" id="dName" required /></label>
                    <label>Host <input type="text" id="dHost" value="localhost" required /></label>
                    <label>Port <input type="number" id="dPort" value="3493" required /></label>
                    <label>UPS Name <input type="text" id="dUpsName" value="ups" required /></label>
                    <label>Username <input type="text" id="dUsername" /></label>
                    <label>Password <input type="password" id="dPassword" /></label>
                    <label>Low battery % <input type="number" id="dLowBat" value="20" min="0" max="100" /></label>
                    <label>Low runtime (min) <input type="number" id="dLowRun" value="10" min="0" /></label>
                    <label>Max load % <input type="number" id="dMaxLoad" value="90" min="0" max="100" /></label>
                    <label>Max temp (C) <input type="number" id="dMaxTemp" value="45" min="0" /></label>
                    <button type="button" id="dTest">Test Connection</button>
                    <button type="submit" id="dSave">Save</button>
                    <button type="button" id="dReset" class="secondary">Reset</button>
                </form>
                <p id="dError" class="error-text"></p>
            </div>
            <div class="card">
                <h2 id="devicesTitle">Devices</h2>
                <div id="devicesList">
                    <p class="empty">No devices.</p>
                </div>
            </div>
        </div>

        <div id="panel-events" class="tab-panel" hidden>
            <div class="card">
                <h2 id="eventsTitle">Events</h2>
                <div id="eventsList">
                    <p class="empty">No events.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>

</html>
