<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansible Playbook Runner</title>
    <script src="/static/js/purify.min.js"></script>

    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Ansible Playbook Runner</h1>
            <span class="status" id="status">Loading...</span>
        </header>
        <div id="toasts" class="live" aria-live="polite"></div>
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-tab="playbooks">Playbooks</button>
            <button class="tab" role="tab" data-tab="run">Run</button>
            <button class="tab" role="tab" data-tab="runs">Runs</button>
            <button class="tab" role="tab" data-tab="schedule">Schedule</button>
        </div>

        <div id="panel-playbooks" class="tab-panel">
            <div class="card">
                <h2>Add / Edit Playbook</h2>
                <form class="form" id="pbForm">
                    <input type="hidden" id="pbOld" />
                    <label>Name <input type="text" id="pbName" required placeholder="proxmox-patches.yml" /></label>
                    <label>Path <input type="text" id="pbPath" required
                            placeholder="playbooks/proxmox-patches.yml" /></label>
                    <label style="flex:1 1 100%;">Playbook YAML <textarea id="pbContent" rows="10"
                            placeholder="---\n- hosts: all\n  tasks:\n    - name: example\n      debug: msg=hello"></textarea></label>
                    <button type="submit">Save</button>
                    <button type="button" id="pbReset" class="secondary">New</button>
                </form>
                <p id="pbError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Playbooks</h2>
                <div class="actions" style="margin-bottom:12px;">
                    <input type="text" id="pbSearch" placeholder="Search playbooks" />
                </div>
                <div id="playbooksList">
                    <p class="empty">No playbooks.</p>
                </div>
            </div>
        </div>

        <div id="panel-run" class="tab-panel" hidden>
            <div class="card">
                <h2>Run Playbook</h2>
                <form class="form" id="runForm">
                    <label>Playbook <select id="rPlaybook" required></select></label>
                    <label>Cluster <select id="rCluster">
                            <option value="">None</option>
                        </select></label>
                    <label>Limit <input type="text" id="rLimit" /></label>
                    <label style="flex:1 1 100%;">Extra vars (JSON) <textarea id="rExtra" rows="3"
                            placeholder='{"var":"value"}'></textarea></label>
                    <label><input type="checkbox" id="rDry" /> Dry run / check mode</label>
                    <button type="submit">Run</button>
                </form>
                <p id="rError" class="error-text"></p>
                <div id="runResult"></div>
            </div>
        </div>

        <div id="panel-runs" class="tab-panel" hidden>
            <div class="card">
                <h2>Run History</h2>
                <div id="runsList">
                    <p class="empty">No runs.</p>
                </div>
            </div>
        </div>

        <div id="panel-schedule" class="tab-panel" hidden>
            <div class="card">
                <h2>Add Schedule</h2>
                <form class="form" id="schForm">
                    <label>Playbook <select id="sPlaybook" required></select></label>
                    <label>Cluster <select id="sCluster">
                            <option value="">None</option>
                        </select></label>
                    <label>Cron <input type="text" id="sCron" placeholder="0 3 * * 0" required /></label>
                    <label style="flex:1 1 100%;">Extra vars (JSON) <textarea id="sExtra" rows="3"
                            placeholder='{"var":"value"}'></textarea></label>
                    <label><input type="checkbox" id="sEnabled" checked /> Enabled</label>
                    <button type="submit">Add</button>
                </form>
                <p id="sError" class="error-text"></p>
            </div>
            <div class="card">
                <h2>Schedules</h2>
                <div id="schedulesList">
                    <p class="empty">No schedules.</p>
                </div>
            </div>
        </div>
    </div>


    <script src="ui.js"></script>
</body>

</html>
