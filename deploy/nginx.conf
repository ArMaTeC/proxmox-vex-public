# ProxmoxVEx distribution host — cache policy (spec 093/US031)
#
# Correct caching here is a correctness feature, not a perf tweak:
#   * version.json (+ .asc) is the update trust root — a stale cached copy
#     means clients see an old channel pointer or a revoked key rotation
#     document. It must be revalidated every time.
#   * ProxmoxVEx-<semver>.tar.gz artifacts are content-addressed by version:
#     a given version's bytes never change, so they are immutable forever.
#   * ProxmoxVEx-latest.tar.gz is a MOVING pointer — cache briefly only.
#   * *.asc detached signatures follow their payload's policy, but metadata
#     signatures (version.json.asc, transparency.log.asc, rotation docs)
#     must revalidate like the metadata they protect.

# Publish layout (see scripts/publish.sh, spec 093/US033):
#   /var/www/proxmoxvex-dist/releases/<ver>/  staged artifact sets (inert)
#   /var/www/proxmoxvex-dist/current         symlink -> releases/<ver>
#   /var/www/proxmoxvex-dist/version.json    pointer metadata (updated LAST)
# nginx serves /downloads/ from `current` so the symlink swap is the only
# moment clients' view changes — never a half-uploaded set.

# US039: JSON access log for the metrics rollup (deploy/metrics.sh).
# log_format lives in http context — if this file is included inside a
# server{} block elsewhere, move this line to the http{} level.
log_format vexdl '{"uri":"$uri","status":$status,"bytes":$body_bytes_sent}';

server {
    listen 443 ssl;
    server_name proxmoxvex.com;
    root /var/www/proxmoxvex-dist;

    # Release metadata — never serve from cache without revalidation.
    location ~* /(version\.json|version\.json\.asc|transparency\.log|transparency\.log\.asc|checksums\.txt|keys/.*\.json(\.asc)?)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The -latest pointer — a 302 to the versioned artifact, generated by
    # publish.sh so it always targets a complete, immutable file (US038).
    include /var/www/proxmoxvex-dist/latest.conf;

    # Versioned artifacts — immutable for a year. Semver in the filename
    # makes each build a distinct URL, so long-cache is safe.
    location ~* /ProxmoxVEx-\d+\.\d+\.\d+[^/]*\.(tar\.gz|vexbundle)(\.asc)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SBOM / per-file manifests — versioned per release, also immutable.
    location ~* /(sbom|MANIFEST)[^/]*$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # spec 093/US046: token-gated enterprise channel — early-access/licensed
    # artifacts live under /downloads/enterprise/ and require a valid bearer
    # token. auth_request delegates the verdict to the licensing service;
    # a missing/malformed header 401s locally without an upstream call.
    location /downloads/enterprise/ {
        if ($http_authorization !~ "^Bearer .+") { return 401; }
        auth_request /_verify-token;
        alias /var/www/proxmoxvex-dist/current/enterprise/;
        add_header Cache-Control "private, max-age=60" always;
        access_log /var/log/nginx/vexdl.json vexdl;
    }
    location = /_verify-token {
        internal;
        proxy_pass https://licensing.proxmoxvex.com/api/tokens/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Auth-Token $http_authorization;
    }

    # Everything else under downloads/ — served from the `current` symlink so
    # publishes are atomic; default short cache.
    location /downloads/ {
        alias /var/www/proxmoxvex-dist/current/;
        add_header Cache-Control "public, max-age=300" always;
        access_log /var/log/nginx/vexdl.json vexdl;
    }

    # Metadata paths also feed the metrics log.
    location / {
        access_log /var/log/nginx/vexdl.json vexdl;
    }
}
