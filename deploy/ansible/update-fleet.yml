# deploy/ansible/update-fleet.yml — rolling fleet update for ProxmoxVEx.
#
# Serial batching keeps the fleet mostly up while each host updates; the
# health gate between hosts stops the roll if a batch member comes back
# unhealthy (the updater already auto-rolled it back on the host, so the
# rest of the fleet simply stays on the prior release).
#
# Inventory: a [vex_installs] group whose hosts have update.sh on
# UPDATE_BIN (default /opt/vex/update.sh).
#
#   ansible-playbook -i inventory.ini deploy/ansible/update-fleet.yml
#   ansible-playbook -i inventory.ini -e serial_batch=5 ...   # widen batch
#   ansible-playbook -i inventory.ini -e update_window=03:00-05:00 ...
---
- name: ProxmoxVEx rolling fleet update
  hosts: vex_installs
  serial: "{{ serial_batch | default(1) }}"
  become: true
  vars:
    update_bin: /opt/vex/update.sh
    update_window: "02:00-04:00"
    health_url: "http://127.0.0.1:5000/api/health"
    health_retries: 30          # 30 x 10s = 5min post-update grace
    health_delay: 10

  tasks:
    - name: Record current version for the run log
      command: cat .active-version
      args:
        chdir: "{{ update_bin | dirname }}"
      register: before
      changed_when: false
      failed_when: false

    - name: Run the updater non-interactively inside the maintenance window
      command: "{{ update_bin }} --yes"
      environment:
        VEX_UPDATE_WINDOW: "{{ update_window }}"
      register: upd
      changed_when: upd.rc == 0
      # rc 0 = updated/current; the updater dies loudly on real failures.
      failed_when: upd.rc != 0

    - name: Health gate — refuse to proceed to the next host if unhealthy
      uri:
        url: "{{ health_url }}"
        status_code: 200
        timeout: 5
      register: health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health.status == 200
      delegate_to: localhost        # probe the target via its own loopback
      # NOTE: delegate_to localhost curls from the control node; drop the
      # delegate line to probe from each managed host instead.
      ignore_errors: true           # unreachable proxy is not fatal to gate

    - name: Health gate (fallback probe from the managed host)
      uri:
        url: "{{ health_url }}"
        status_code: 200
        timeout: 5
      register: health_local
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health_local.status == 200
      when: health is failed

    - name: Report outcome for the audit trail
      debug:
        msg: >-
          {{ inventory_hostname }}: {{ before.stdout | default('?') }} ->
          update rc={{ upd.rc }} health={{ (health.status | default(health_local.status | default('?')) ) }}
