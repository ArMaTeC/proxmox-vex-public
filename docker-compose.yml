services:
  proxmoxvex:
    image: proxmoxvex:1.2.298
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: proxmoxvex
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
    environment:
      PROXMOXVEX_DATABASE_URL: postgresql://proxmoxvex:proxmoxvex@postgres:5432/proxmoxvex
      PROXMOXVEX_BEHIND_PROXY: "true"
      PROXMOXVEX_HOST: "0.0.0.0"
    volumes:
      - proxmoxvex_config:/app/config
      - proxmoxvex_logs:/app/logs
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: proxmoxvex-postgres
    environment:
      POSTGRES_USER: proxmoxvex
      POSTGRES_PASSWORD: proxmoxvex
      POSTGRES_DB: proxmoxvex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  proxmoxvex_config:
  proxmoxvex_logs:
  postgres_data:
